// ============================================================
//  Entities: Fighter (heroes & enemies), Projectile, Zone, Pickup, Prop
// ============================================================
let S = null;           // current stage (set by Stage)
let NEXT_ID = 1;
const GRAV = 1600;
const depthScale = (z) => 0.86 + 0.22 * (z / DEPTH);
const scrY = (z, y) => GROUND_TOP + z - y;

class Fighter {
  constructor(o) {
    this.id = NEXT_ID++;
    this.team = o.team;
    this.kind = o.kind;
    this.def = o.def;
    this.isHero = o.team === 'hero';
    this.isBoss = !!o.boss; this.isElite = !!o.elite;
    this.x = o.x; this.y = o.y || 0; this.z = clamp(o.z ?? DEPTH / 2, 0, DEPTH);
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.face = o.face || 1;
    this.scale = o.scale || 1;
    this.art = o.def.art || 'human';
    this.look = Object.assign({}, o.def.look);
    this.maxHp = o.hp; this.hp = o.hp;
    this.mp = 0; this.maxMp = 0;
    this.state = 'idle'; this.stateT = 0;
    this.anim = 'idle'; this.animT = 0;
    this.clock = Math.random() * 10;
    this.walkPhase = 0;
    this.move = null; this.hitIds = new Set(); this.multiT = 0;
    this.combo = 0; this.comboWin = 0; this.buffer = 0;
    this.st = { burn: 0, burnDps: 0, burnSrc: null, chill: 0, chillT: 0, frozen: 0, stun: 0, slowT: 0, shock: 0, poison: 0 };
    this.inv = 0; this.flash = 0; this.fall = 0;
    this.w = (o.def.w || 34) * this.scale;
    this.h = (o.def.h || 104) * this.scale;
    this.weight = o.def.weight || 1;
    this.ts = 1;             // local time scale
    this.dead = false; this.remove = false;
    this.airAtk = false; this.jumps = 0;
    this.blinkT = R(2, 5); this.blinking = 0;
    this.dmg = o.dmg || 8;
    this.speed = o.speed || 100;
    this.ai = o.ai || null;
    this.flying = !!o.def.flying;
    if (this.flying) this.y = 0;
    this.shield = 0; this.mods = [];
    this.held = null;
    this.spawnT = 0;
    this.moving = false;
  }
  get alive() { return !this.dead; }
  get grounded() { return this.y <= 0.01 && !this.flying; }
  canAct() { return !this.dead && ['idle', 'walk', 'run', 'land', 'block', 'hold'].includes(this.state); }
  setState(s, anim) {
    this.state = s; this.stateT = 0;
    this.anim = anim || s; this.animT = 0;
    if (s !== 'attack') { this.move = null; }
  }
  facingTo(o) { return sign(o.x - this.x); }
  isFacing(o) { return (o.x - this.x) * this.face >= -4; }

  startMove(name, opts = {}) {
    const m = MOVES[name];
    if (!m) return;
    const spd = this.isHero ? S.hero.stats.atkSpeed : 1;
    const mv = Object.assign({}, m, opts);
    mv.name = name;
    mv.windup /= spd; mv.active /= Math.min(spd, 1.3); mv.recover /= spd;
    this.move = mv;
    this.state = 'attack'; this.stateT = 0; this.anim = 'attack'; this.animT = 0;
    this.hitIds.clear(); this.multiT = 0;
    this.attacking = true;
    if (!mv.air) this.vx *= 0.2;
    Sfx.play('whoosh');
  }

  update(dt) {
    const st = this.st;
    // status effects tick in real (not local) time so freezes stay fair
    if (st.frozen > 0) {
      st.frozen -= dt;
      if (st.frozen <= 0) { st.frozen = 0; for (let i = 0; i < 8; i++) Particles.add({ x: this.x + R(-15, 15), y: scrY(this.z, this.y) - R(10, 60), vx: R(-80, 80), vy: R(-160, -40), g: 500, life: 0.5, size: 4, color: '#bff5ff', type: 'shard' }); }
    }
    if (st.burn > 0) {
      st.burn -= dt;
      st.burnTick = (st.burnTick || 0) - dt;
      if (st.burnTick <= 0) {
        st.burnTick = 0.4;
        dealDamage(st.burnSrc, this, { dmg: st.burnDps * 0.4, el: 'fire', dot: true });
      }
      if (Math.random() < dt * 20) Particles.add({ x: this.x + R(-12, 12) * this.scale, y: scrY(this.z, this.y) - R(10, this.h * 0.8), vx: R(-10, 10), vy: R(-90, -40), life: 0.5, size: R(3, 6), color: pick(['#ff7a2f', '#ffd35c']), glow: true });
    }
    if (st.poison > 0) {
      st.poison -= dt; st.poisonTick = (st.poisonTick || 0) - dt;
      if (st.poisonTick <= 0) { st.poisonTick = 0.5; dealDamage(null, this, { dmg: st.poisonDps * 0.5, el: 'poison', dot: true }); }
    }
    if (st.chillT > 0) { st.chillT -= dt; if (st.chillT <= 0) st.chill = 0; }
    if (st.slowT > 0) st.slowT -= dt;
    if (st.shock > 0) st.shock -= dt;
    // time scale: chrono bubbles / time stop / overdrive
    let ts = 1;
    if (!this.isHero) {
      if (S.timeStop > 0 && !this.ignoreTime) ts = 0;
      else {
        if (S.inChrono(this)) ts *= 0.3;
        if (st.slowT > 0) ts *= 0.55;
        if (S.hero && S.hero.overdrive > 0) ts *= 0.5;
        if (st.chill > 0) ts *= 1 - Math.min(0.5, st.chill * 0.15);
      }
    }
    if (st.frozen > 0) ts = 0;
    this.ts = ts;
    const ldt = dt * ts;
    this.clock += ldt;
    this.stateT += ldt; this.animT += ldt;
    if (this.inv > 0) this.inv -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.fall > 0) this.fall = Math.max(0, this.fall - 45 * ldt);
    if (this.comboWin > 0) { this.comboWin -= ldt; if (this.comboWin <= 0) this.combo = 0; }
    if (this.buffer > 0) this.buffer -= dt;
    // blinking eyes
    this.blinkT -= dt;
    if (this.blinkT <= 0) { this.blinking = 0.12; this.blinkT = R(2, 5); }
    if (this.blinking > 0) this.blinking -= dt;
    this.look._blink = this.blinking > 0; this.look._t = this.clock;
    if (ldt <= 0) return;
    this.updateState(ldt);
    this.physics(ldt);
  }

  updateState(dt) {
    const m = this.move;
    switch (this.state) {
      case 'attack': {
        if (!m) { this.setState('idle'); break; }
        const t = this.stateT;
        // lunge during windup end / active
        if (m.lunge && t >= m.windup * 0.5 && t < m.windup + m.active) {
          const k = this.isHero ? 1 : 0.8;
          this.vx = this.face * m.lunge * k * (m.air ? 0 : 1) + (m.air ? this.vx : 0);
        } else if (!m.air) this.vx *= 0.8;
        if (t >= m.windup && t < m.windup + m.active) {
          this.activeHit = true;
          if (m.multi) { this.multiT -= dt; if (this.multiT <= 0) { this.multiT = m.multi; this.hitIds.clear(); } }
          if (!this.sfxActive) { this.sfxActive = true; if (m.shock) this.onShock(m); }
        } else this.activeHit = false;
        const total = m.windup + m.active + m.recover;
        // hero combo cancel into next move during recovery
        if (this.isHero && t >= m.windup + m.active && this.buffer > 0 && !m.air) {
          this.sfxActive = false;
          heroNextCombo(this);
          break;
        }
        if (m.air) {
          if (this.grounded && t > 0.05) { this.sfxActive = false; this.attacking = false; this.setState('land'); }
        } else if (t >= total) {
          this.sfxActive = false; this.attacking = false; this.activeHit = false;
          this.setState(this.held ? 'hold' : 'idle');
        }
        break;
      }
      case 'hurt': if (this.stateT > (this.hurtDur || 0.3)) this.setState('idle'); break;
      case 'air': if (this.grounded && this.stateT > 0.05) { this.setState('down'); this.vx *= 0.3; Sfx.play('land'); dust(this.x, this.z, 10); if (this.onDownHit) this.onDownHit(); } break;
      case 'down': {
        if (this.dead) break;
        const dur = this.isHero ? 0.55 : this.isBoss ? 0.5 : 0.8;
        if (this.stateT > dur) { this.setState('getup'); this.inv = 0.5; }
        break;
      }
      case 'getup': if (this.stateT > 0.35) { this.setState('idle'); if (this.isHero) this.inv = 1.0; this.fall = 0; } break;
      case 'stun': if (this.stateT > (this.stunDur || 1)) this.setState('idle'); break;
      case 'land': if (this.stateT > 0.1) this.setState(this.held ? 'hold' : 'idle'); break;
      case 'cast': if (this.stateT > (this.castDur || 0.3)) this.setState('idle'); break;
      case 'throw': if (this.stateT > 0.25) this.setState('idle'); break;
      case 'dash': if (this.stateT > (this.dashDur || 0.2)) { this.setState('idle'); this.vx *= 0.2; } break;
      case 'spawn': if (this.stateT > 0.45) this.setState('idle'); break;
      case 'dead': {
        if (this.stateT > 1.4 && !this.isHero) this.remove = true;
        break;
      }
      case 'jump': {
        if (this.grounded && this.stateT > 0.05) { this.setState('land'); Sfx.play('land'); dust(this.x, this.z, 6); this.jumps = 0; this.airAtk = false; }
        break;
      }
    }
  }

  physics(dt) {
    // gravity
    if (!this.flying || this.state === 'air' || this.state === 'dead' || this.state === 'down') {
      if (this.y > 0 || this.vy > 0) {
        this.vy -= GRAV * dt;
        this.y += this.vy * dt;
        if (this.y <= 0) {
          this.y = 0;
          if (this.state === 'air' && this.vy < -420 && !this.bounced) { this.vy = -this.vy * 0.35; this.y = 0.1; this.bounced = true; this.vx *= 0.6; dust(this.x, this.z, 6); Sfx.play('land'); }
          else { this.vy = 0; this.bounced = false; }
        }
      }
    } else {
      // flyers hover
      const targetY = this.hoverY ?? 46;
      this.y = lerp(this.y, targetY, Math.min(1, dt * 3));
    }
    this.x += this.vx * dt;
    this.z += this.vz * dt;
    // friction
    const onGround = this.y <= 0.01;
    if (onGround && !['walk', 'run', 'attack', 'dash', 'hold'].includes(this.state)) { this.vx *= Math.pow(0.0005, dt); this.vz *= Math.pow(0.0005, dt); }
    if (this.state === 'down' || this.state === 'dead') { this.vx *= Math.pow(0.001, dt); }
    this.z = clamp(this.z, 0, DEPTH);
    // bounds
    const b = S.bounds(this);
    if (this.x < b[0]) { this.x = b[0]; if (this.state === 'air') this.vx = Math.abs(this.vx) * 0.4; }
    if (this.x > b[1]) { this.x = b[1]; if (this.state === 'air') this.vx = -Math.abs(this.vx) * 0.4; }
  }

  // hurtbox test against a world-space box
  overlaps(x0, x1, y0, y1, z, zr) {
    const hw = this.w * 0.5;
    if (this.x + hw < x0 || this.x - hw > x1) return false;
    const by = this.y + (this.flying ? -10 : 0);
    if (by + this.h < y0 || by > y1) return false;
    return Math.abs(this.z - z) <= zr + 10;
  }
  hitBox() {
    const m = this.move;
    const s = this.scale * (this.isHero ? S.hero.stats.reach : 1);
    const a = this.x + this.face * m.hit.x0 * s, b = this.x + this.face * m.hit.x1 * s;
    return { x0: Math.min(a, b), x1: Math.max(a, b), y0: this.y + m.hit.y0 * this.scale, y1: this.y + m.hit.y1 * this.scale, z: this.z, zr: m.hit.zr * Math.max(1, this.scale * 0.85) };
  }
  onShock(m) {
    // ground shock (slams): dust ring + screenshake
    S.shake(m.shake || 6);
    const x = this.x + this.face * 60 * this.scale;
    Particles.add({ x, y: scrY(this.z, 0), type: 'ring', size: 60 * this.scale, life: 0.35, color: '#fff' });
    dust(x, this.z, 14);
    if (this.isHero && S.hero.cards.wpn_earth) {
      S.addZone(new Zone({ team: 'hero', x, z: this.z, rx: 110, rz: 50, life: 0.25, kind: 'quakeRing', dmg: S.hero.baseDmg() * 1.2, el: 'earth', owner: this, once: true, launch: 260 }));
    }
  }
}

function heroNextCombo(f) {
  const h = S.hero;
  f.buffer = 0;
  const combo = h.weaponType.combo;
  h.comboStep = (h.comboStep + 1) % combo.length;
  f.attacking = false;
  f.startMove(combo[h.comboStep]);
  // a short forward step makes combos feel connected
}

// ------------------------------------------------------------
//  Damage resolution
// ------------------------------------------------------------
function dealDamage(att, tgt, info) {
  if (!tgt || tgt.dead) return 0;
  if (tgt.isHero && S.god) return 0;
  if (!info.dot && !info.ignoreInv && (tgt.inv > 0 || tgt.state === 'down' || tgt.state === 'getup' || tgt.state === 'spawn' || tgt.hidden)) return 0;
  const hero = S.hero;
  let dmg = info.dmg;
  const heroAtk = att && att.isHero;
  let crit = false;
  if (heroAtk && !info.dot) {
    const st = hero.stats;
    if (Math.random() < st.critChance) { crit = true; dmg *= st.critMul; }
    if (info.melee) {
      if (hero.cards.comboGloves) dmg *= 1 + Math.min(hero.cards.comboGloves * 0.25, S.combo * hero.cards.comboGloves * 0.01);
      if (info.finisher) dmg *= st.finisherMul;
    }
    if (info.spell) dmg *= st.spellMul;
    dmg *= st.dmgMul;
    if (hero.hp < hero.maxHp * 0.35) dmg *= 1 + st.berserk;
    if (hero.overdrive > 0) dmg *= 2;
    if (info.el === 'storm' && hero.cards.duo_plasma && tgt.st.burn > 0) dmg *= 1.4;
    const hid = hero.hdef.id;
    if (hid === 'glitch' && info.melee && Math.random() < 0.1) { dmg *= 3; Floaters.add(tgt.x, scrY(tgt.z, tgt.h + 40), 'CRITICAL ERROR', { color: '#ff3df2', size: 18, font: FONT_PIXEL }); }
    if (hid === 'bruno' && info.kx) info = Object.assign({}, info, { kx: info.kx * 1.25 });
  }
  // blocking
  if (!info.dot && !info.unblockable && tgt.state === 'block' && att && tgt.isFacing(att)) {
    const mul = tgt.isHero ? hero.stats.blockMul : 0.15;
    dmg *= mul;
    tgt.hp -= dmg;
    tgt.vx = -tgt.face * 90;
    Sfx.play('block');
    spark(tgt.x + tgt.face * 16, tgt.z, tgt.y + tgt.h * 0.55, '#bfe9ff', 6);
    S.hitstop = Math.max(S.hitstop, 0.03);
    if (tgt.isHero && tgt.hdef.id === 'mira') {
      tgt.mp = Math.min(tgt.maxMp, tgt.mp + 6);
      if (att && !att.isHero) { att.st.chill += 1; att.st.chillT = 3; }
      Particles.burst(tgt.x + tgt.face * 20, scrY(tgt.z, 60), 5, { speed: 120, life: 0.4, size: 3, colors: ['#bff5ff', '#7fe3ff'], type: 'shard' });
    }
    if (tgt.isHero) { tgt.guard = (tgt.guard || 0) + info.dmg; if (tgt.guard > tgt.maxHp * 0.5) { tgt.guard = 0; tgt.setState('stun'); tgt.stunDur = 0.9; Floaters.add(tgt.x, scrY(tgt.z, tgt.h + 20), 'GUARD BREAK', { color: '#ff4f73', size: 18 }); } }
    if (!tgt.isHero && tgt.def.blocker) { tgt.blockHits = (tgt.blockHits || 0) + 1; }
    if (tgt.hp <= 0) killFighter(tgt, att, info);
    return dmg;
  }
  // shatter frozen targets
  if (tgt.st.frozen > 0 && !info.dot && (info.el === 'fire' || info.el === 'earth' || info.heavy || info.finisher)) {
    dmg = dmg * 2 + 10;
    tgt.st.frozen = 0;
    Sfx.play('shatter');
    for (let i = 0; i < 18; i++) Particles.add({ x: tgt.x + R(-20, 20), y: scrY(tgt.z, tgt.y) - R(10, tgt.h), vx: R(-260, 260), vy: R(-360, -60), g: 900, life: R(0.5, 0.9), size: R(3, 7), color: pick(['#bff5ff', '#7fe3ff', '#ffffff']), type: 'shard' });
    Floaters.add(tgt.x, scrY(tgt.z, tgt.h + 30), 'SHATTER!', { color: '#bff5ff', size: 22 });
    if (heroAtk) { SAVE.stats.shatters++; if (SAVE.stats.shatters >= 10) unlockAch('shatter'); }
    if (heroAtk && hero.cards.duo_steam && info.el === 'fire') steamBurst(tgt.x, tgt.z, hero);
  }
  // elite shield
  if (tgt.shield > 0) {
    const a = Math.min(tgt.shield, dmg); tgt.shield -= a; dmg -= a;
    spark(tgt.x, tgt.z, tgt.y + tgt.h * 0.5, '#55c8ff', 4);
  }
  dmg = Math.max(0, dmg);
  tgt.hp -= dmg;
  tgt.flash = 0.08;
  if (dmg > 0 && SAVE.settings.dmgNums && (!info.dot || dmg >= 2)) {
    const color = tgt.isHero ? '#ff4f73' : crit ? '#ffe45c' : info.dot ? EL[info.el]?.c || '#fff' : '#ffffff';
    Floaters.add(tgt.x + R(-10, 10), scrY(tgt.z, tgt.y + tgt.h + 8), (crit ? '' : '') + Math.round(dmg) + (crit ? '!' : ''), { color, size: crit ? 30 : info.dot ? 16 : 22, pop: crit ? 1.4 : 1 });
  }
  if (!info.dot) {
    const hs = info.stop ?? 0.05;
    S.hitstop = Math.max(S.hitstop, crit ? hs + 0.04 : hs);
    Sfx.play(crit ? 'crit' : info.sfx || 'hit');
    const col = info.el && info.el !== 'phys' ? EL[info.el].c : '#fff4c2';
    spark(tgt.x - (att ? sign(tgt.x - att.x) * 8 : 0), tgt.z, tgt.y + tgt.h * 0.6, col, crit ? 12 : 7);
    if (crit || info.heavy || info.finisher) S.shake(crit ? 6 : 4);
  }
  // hero-side bookkeeping
  if (heroAtk) {
    if (!info.dot) {
      S.combo++; S.comboT = 2.4;
      S.maxCombo = Math.max(S.maxCombo, S.combo);
      if (crit) SAVE.stats.crits++;
    }
    hero.addOverdrive(dmg * 0.3);
    if (hero.stats.lifesteal > 0) hero.heal(dmg * hero.stats.lifesteal, true);
    S.dmgDealt += dmg;
  }
  if (tgt.isHero && !info.dot && tgt.hdef.id === 'kit' && S.time - (tgt.kitT ?? -99) > 8) {
    // Borrowed Time: everything nearby slows down for a moment
    tgt.kitT = S.time;
    for (const e of S.enemies) if (!e.dead && Math.abs(e.x - tgt.x) < 280) e.st.slowT = Math.max(e.st.slowT, 1.8);
    Particles.add({ x: tgt.x, y: scrY(tgt.z, 0), type: 'ring', size: 200, life: 0.5, color: '#c58cff' });
    Floaters.add(tgt.x, scrY(tgt.z, tgt.h + 50), 'BORROWED TIME', { color: '#c58cff', size: 18 });
    Sfx.play('time');
  }
  if (tgt.isHero) {
    S.tookDamage = true;
    if (S.dmgLog) { const k = (att ? att.kind + (att.isBoss ? '*' : '') : 'env') + ':' + (info.el || 'phys') + (info.dot ? ':dot' : ''); S.dmgLog[k] = (S.dmgLog[k] || 0) + dmg; }
    hero.addOverdrive(dmg * 0.6);
    S.flashRed = 0.25;
    if (att && !info.dot && hero.stats.thorns > 0 && info.melee) dealDamage(hero, att, { dmg: info.dmg * hero.stats.thorns, el: 'earth', dot: true });
    if (att && att.mods && att.mods.includes('vampiric')) att.hp = Math.min(att.maxHp, att.hp + dmg);
  }
  // element statuses
  if (!info.dot) applyElement(att, tgt, info, dmg);
  if (tgt.hp <= 0) { killFighter(tgt, att, info, dmg); return dmg; }
  if (tgt.isHero && !info.dot && dmg > 0) tgt.inv = Math.max(tgt.inv, 0.35);
  // reactions
  if (!info.dot && !info.noKnock) react(tgt, att, info);
  return dmg;
}

function applyElement(att, tgt, info, dmg) {
  const el = info.el;
  const hero = S.hero;
  if (el === 'fire') { const dur = tgt.isHero ? 1.4 : 2.5; tgt.st.burn = Math.max(tgt.st.burn, dur); tgt.st.burnDps = Math.max(tgt.isHero ? 0 : tgt.st.burnDps, Math.max(tgt.isHero ? 2 : 3, dmg * (tgt.isHero ? 0.2 : 0.3))); tgt.st.burnSrc = att; }
  else if (el === 'ice') {
    tgt.st.chill += info.chill || 1; tgt.st.chillT = 3;
    const need = tgt.isBoss ? 6 : 3;
    if (tgt.st.chill >= need && !tgt.isHero) {
      tgt.st.chill = 0;
      let dur = tgt.isBoss ? 1.0 : 2.4;
      if (hero && hero.cards.duo_permafrost) dur *= 1.6;
      tgt.st.frozen = dur;
      Sfx.play('ice');
      if (tgt.state === 'air') tgt.vx = 0;
    } else if (tgt.isHero && tgt.st.chill >= 5) { tgt.st.chill = 0; tgt.st.frozen = 0.7; Floaters.add(tgt.x, scrY(tgt.z, tgt.h + 30), 'FROZEN!', { color: '#7fe3ff', size: 18 }); }
  }
  else if (el === 'storm') { tgt.st.shock = 0.5; if (!tgt.isBoss && !info.noStun) { tgt.st.stunMini = 0.25; } }
  else if (el === 'time') { tgt.st.slowT = Math.max(tgt.st.slowT, info.slow || 2); }
  else if (el === 'poison') { tgt.st.poison = 4; tgt.st.poisonDps = Math.max(2, dmg * 0.3); }
  else if (el === 'earth') { tgt.fall += 30; }
  // weapon infusions on hero basic attacks
  if (att && att.isHero && info.melee) {
    const c = hero.cards;
    if (c.wpn_fire && el !== 'fire') { tgt.st.burn = 2; tgt.st.burnDps = Math.max(tgt.st.burnDps, 3 + hero.baseDmg() * 0.25); tgt.st.burnSrc = att; }
    if (c.wpn_ice) { tgt.st.chill += 1; tgt.st.chillT = 3; if (tgt.st.chill >= (tgt.isBoss ? 6 : 3)) { tgt.st.chill = 0; tgt.st.frozen = (tgt.isBoss ? 0.8 : 2) * (c.duo_permafrost ? 1.6 : 1); Sfx.play('ice'); } }
    if (c.wpn_time) tgt.st.slowT = Math.max(tgt.st.slowT, 1.5);
    if (c.wpn_storm && Math.random() < 0.5) chainLightning(att, tgt, 1, hero.baseDmg() * 0.6, 170, [tgt.id]);
  }
}

function react(tgt, att, info) {
  const dir = info.dir ?? (att ? sign(tgt.x - att.x) : -tgt.face);
  if (tgt.st.frozen > 0) { tgt.vx = dir * 40; return; }
  const bossArmor = tgt.isBoss || (tgt.def && tgt.def.noKnock);
  if (bossArmor) {
    // bosses flinch only when idle-ish, never get juggled

class Pickup {
  constructor(o) {
    Object.assign(this, { y: 20, vy: R(160, 260), vx: R(-80, 80), vz: R(-40, 40), t: 0, dead: false, magnet: false }, o);
    this.id = NEXT_ID++;
  }
  update(dt) {
    this.t += dt;
    const h = S.hero;
    const dx = h.x - this.x, dz = h.z - this.z;
    const d = Math.hypot(dx, dz);
    if (!this.magnet && this.t > 0.35 && (d < h.stats.magnet || S.vacuum) && (this.kind === 'xp' || this.kind === 'coin' || S.vacuum)) this.magnet = true;
    if (this.magnet && !h.dead) {
      const sp = 520 + this.t * 200;
      this.x += (dx / (d || 1)) * sp * dt; this.z += (dz / (d || 1)) * sp * dt;
      this.y = lerp(this.y, 30, dt * 8);
    } else {
      this.vy -= GRAV * dt; this.y += this.vy * dt;
      if (this.y <= 0) { this.y = 0; this.vy = -this.vy * 0.4; if (Math.abs(this.vy) < 40) this.vy = 0; this.vx *= 0.6; this.vz *= 0.6; }
      this.x += this.vx * dt; this.z = clamp(this.z + this.vz * dt, 0, DEPTH);
    }
    if (d < 34 && this.t > 0.2 && Math.abs(h.y - this.y) < 80) { this.collect(h); }
    if (this.t > 30 && !this.magnet) this.dead = true;
  }
  collect(h) {
    this.dead = true;
    switch (this.kind) {
      case 'xp': h.gainXp(this.value); Sfx.play('gem'); SAVE.stats.gems++; break;
      case 'coin': S.quarters += this.value * h.stats.qMul; Sfx.play('coin'); Floaters.add(this.x, scrY(this.z, 60), '+' + Math.round(this.value * h.stats.qMul) + '¢', { color: '#ffc53d', size: 16, font: FONT_PIXEL }); break;
      case 'milk': case 'food': {
        const amt = (this.kind === 'milk' ? 35 : 22) * h.stats.foodMul;
        h.heal(amt); h.mp = Math.min(h.maxMp, h.mp + 25); Sfx.play('heal');
        Floaters.add(this.x, scrY(this.z, 70), this.kind === 'milk' ? 'MILK! +' + Math.round(amt) : 'NOM! +' + Math.round(amt), { color: '#3ee6a8', size: 18 });
        if (this.kind === 'milk') { SAVE.stats.milk++; if (SAVE.stats.milk >= 25) unlockAch('milk'); }
        break;
      }
      case 'chest': S.openChest(this); break;
      case 'floppy': {
        const id = S.level.id;
        if (S.mode !== 'demo' && LEVEL_BY_ID[id]) {
          SAVE.floppies[id] = true; persist();
          const n = Object.keys(SAVE.floppies).length;
          toast('Golden floppy found!', `${n}/12 · saved to disk`, '💾');
          unlockAch('floppy1'); if (n >= 12) unlockAch('floppies');
        }
        Sfx.play('dialup'); S.flashWhite = 0.2;
        Floaters.add(this.x, scrY(this.z, 90), 'GOLDEN FLOPPY!', { color: '#ffc53d', size: 24, life: 1.6 });
        break;
      }
      case 'mana': h.mp = Math.min(h.maxMp, h.mp + 40); Sfx.play('gem'); Floaters.add(this.x, scrY(this.z, 70), '+MP', { color: '#55c8ff', size: 16 }); break;
    }
  }
  draw(camX) {
    const x = this.x - camX, y = scrY(this.z, this.y);
    if (x < -40 || x > VIEW_W + 40) return;
    const g = ctx;
    const bob = this.y < 1 ? Math.sin(this.t * 5) * 3 : 0;
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(x, scrY(this.z, 0), 8, 3, 0, 0, TAU); g.fill();
    switch (this.kind) {
      case 'xp': {
        const c = this.value >= 10 ? '#ff4f73' : this.value >= 4 ? '#b77cff' : '#3ee6a8';
        g.globalCompositeOperation = 'lighter'; drawGlow(x, y - 8 + bob, 14, c, 0.7); g.globalCompositeOperation = 'source-over';
        g.fillStyle = c; g.strokeStyle = OUTLINE; g.lineWidth = 2;
        const s = this.value >= 10 ? 9 : this.value >= 4 ? 7 : 5.5;
        g.beginPath(); g.moveTo(x, y - 8 + bob - s); g.lineTo(x + s * 0.7, y - 8 + bob); g.lineTo(x, y - 8 + bob + s); g.lineTo(x - s * 0.7, y - 8 + bob); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = 'rgba(255,255,255,.7)'; g.fillRect(x - 1.5, y - 8 + bob - s * 0.5, 2, s * 0.5);
        break;
      }
      case 'coin': {
        g.save(); g.translate(x, y - 10 + bob); g.scale(Math.cos(this.t * 6), 1);
        g.fillStyle = '#ffc53d'; g.strokeStyle = '#a86400'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 8, 0, TAU); g.fill(); g.stroke();
        g.fillStyle = '#fff4c2'; g.fillRect(-1, -5, 2, 10); g.restore();
        break;
      }
      case 'milk': {
        g.fillStyle = '#fff'; g.strokeStyle = OUTLINE; g.lineWidth = 2;
        g.beginPath(); g.moveTo(x - 5, y - 28 + bob); g.lineTo(x + 5, y - 28 + bob); g.lineTo(x + 5, y - 22 + bob); g.lineTo(x + 8, y - 18 + bob); g.lineTo(x + 8, y + bob); g.lineTo(x - 8, y + bob); g.lineTo(x - 8, y - 18 + bob); g.lineTo(x - 5, y - 22 + bob); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = '#55c8ff'; g.fillRect(x - 8, y - 12 + bob, 16, 5);
        break;
      }
      case 'food': {
        // roast drumstick (the classic wall chicken)
        g.save(); g.translate(x, y - 12 + bob); g.rotate(-0.4);
        g.fillStyle = '#f2ecdc'; g.fillRect(6, -2, 10, 4); g.beginPath(); g.arc(16, -3, 3, 0, TAU); g.arc(16, 3, 3, 0, TAU); g.fill();
        g.fillStyle = '#c9702a'; g.strokeStyle = OUTLINE; g.lineWidth = 2; g.beginPath(); g.ellipse(-2, 0, 12, 9, 0, 0, TAU); g.fill(); g.stroke();
        g.fillStyle = 'rgba(255,255,255,.4)'; g.beginPath(); g.ellipse(-5, -4, 4, 2, -0.3, 0, TAU); g.fill();
        g.restore();
        break;
      }
      case 'floppy': {
        const yy = y - 18 + bob;
        g.globalCompositeOperation = 'lighter'; drawGlow(x, yy, 30 + Math.sin(this.t * 5) * 5, '#ffc53d', 0.8); g.globalCompositeOperation = 'source-over';
        g.save(); g.translate(x, yy); g.rotate(Math.sin(this.t * 3) * 0.2);
        g.fillStyle = '#ffc53d'; g.strokeStyle = OUTLINE; g.lineWidth = 2; g.fillRect(-12, -12, 24, 24); g.strokeRect(-12, -12, 24, 24);
        g.fillStyle = '#fff4c2'; g.fillRect(-6, -12, 12, 7); g.fillStyle = OUTLINE; g.fillRect(2, -11, 3, 5);
        g.fillStyle = '#fff'; g.fillRect(-8, 2, 16, 9);
        g.restore();
        break;
      }
      case 'mana': {
        g.globalCompositeOperation = 'lighter'; drawGlow(x, y - 10 + bob, 16, '#55c8ff', 0.8); g.globalCompositeOperation = 'source-over';
        g.fillStyle = '#55c8ff'; g.strokeStyle = OUTLINE; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y - 20 + bob); g.lineTo(x + 6, y - 10 + bob); g.lineTo(x, y + bob); g.lineTo(x - 6, y - 10 + bob); g.closePath(); g.fill(); g.stroke();
        break;
      }
      case 'chest': {
        const open = this.opened;
        g.fillStyle = '#8a5a2b'; g.strokeStyle = OUTLINE; g.lineWidth = 3;
        roundRect(g, x - 22, y - 30, 44, 30, 4); g.fill(); g.stroke();
        g.fillStyle = '#ffc53d'; g.fillRect(x - 22, y - 20, 44, 5); g.fillRect(x - 4, y - 24, 8, 10);
        g.fillStyle = '#a0703a'; g.beginPath(); g.moveTo(x - 22, y - 30); g.quadraticCurveTo(x, y - 46 - (open ? 10 : 0), x + 22, y - 30); g.fill(); g.stroke();
        g.globalCompositeOperation = 'lighter'; drawGlow(x, y - 30, 30 + Math.sin(this.t * 4) * 5, '#ffc53d', 0.5); g.globalCompositeOperation = 'source-over';
        if (!open && Math.sin(this.t * 3) > 0.7) Particles.add({ x: this.x + R(-20, 20), y: scrY(this.z, 40), vy: -30, life: 0.6, size: 3, color: '#fff4c2', type: 'star' });
        break;
      }
    }
  }
}

class Prop {
  constructor(o) {
    Object.assign(this, { y: 0, hp: 20, t: 0, dead: false, held: false, vx: 0, vy: 0 }, o);
    this.id = NEXT_ID++;
    this.w = 36;
  }
  hit(dmg, att) {
    this.hp -= dmg;
    this.shakeT = 0.2;
    Sfx.play('crate');
    if (this.hp <= 0) this.break();
  }
  break() {
    this.dead = true;
    const sy = scrY(this.z, 20);
    Particles.burst(this.x, sy, 14, { speed: 300, life: 0.7, size: 6, colors: ['#a0703a', '#6b4424', '#c98b3a'], type: 'sq', g: 800, drag: 0.95 });
    dust(this.x, this.z, 8);
    if (this.floppy) { S.addPickup(new Pickup({ kind: 'floppy', x: this.x, z: this.z, vy: 360, vx: 0 })); return; }
    const r = Math.random();
    const drop = this.kind === 'barrel' ? (r < 0.45 ? 'food' : r < 0.75 ? 'milk' : 'coin') : this.kind === 'crate' ? (r < 0.3 ? 'milk' : r < 0.55 ? 'mana' : 'coin') : null;
    if (drop === 'coin') for (let i = 0; i < 4; i++) S.addPickup(new Pickup({ kind: 'coin', value: 2, x: this.x, z: this.z }));
    else if (drop) S.addPickup(new Pickup({ kind: drop, value: 1, x: this.x, z: this.z }));
  }
  update(dt) {
    this.t += dt; if (this.shakeT > 0) this.shakeT -= dt;
    if (this.floppy && Math.random() < dt * 1.5) Particles.add({ x: this.x + R(-18, 18), y: scrY(this.z, R(10, 40)), vy: -30, life: 0.7, size: 3, color: '#ffc53d', type: 'star' });
  }
  draw(camX) {
    if (this.held) return;
    const x = this.x - camX + (this.shakeT > 0 ? R(-3, 3) : 0), y = scrY(this.z, this.y);
    if (x < -60 || x > VIEW_W + 60) return;
    drawPropSprite(ctx, this.kind, x, y);
  }
}
function drawPropSprite(g, kind, x, y) {
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(x, y, 22, 6, 0, 0, TAU); g.fill();
  g.strokeStyle = OUTLINE; g.lineWidth = 3;

    g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(x - 12, y - 42, 5, 40);

    g.strokeStyle = '#7a5230'; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 18, y - 38); g.lineTo(x + 18, y - 2); g.moveTo(x + 18, y - 38); g.lineTo(x - 18, y - 2); g.stroke();

}

// ============================================================
//  Hero: stats, leveling, controls, spells
// ============================================================
function makeHero(heroId, x, z) {
  const def = HEROES[heroId];
  const f = new Fighter({ team: 'hero', kind: heroId, def: { art: 'human', look: def.look, w: 34, h: 104, weight: def.weight }, x, z, hp: def.hp, speed: def.speed });
  f.hdef = def;
  f.weaponType = WEAPON_TYPES[def.weapon];
  f.cards = {};         // card id -> level
  f.spells = [];        // [{id, lvl, cd}]
  f.level = 1; f.xp = 0; f.xpNext = xpForLevel(1);
  f.overdrive = 0; f.od = 0;
  f.comboStep = 0;
  f.revives = (skillRank('g5') ? 1 : 0);
  f.secondWind = 0;
  f.wpnLevel = 0; f.wpnTier = 1;
  f.guard = 0;
  f.look = Object.assign({}, def.look);
  Object.assign(f, HeroMixin);
  f.recalc();
  f.hp = f.maxHp; f.mp = f.maxMp;
  // starting spell
  let sp = def.spell;
  if (sp === 'random') sp = pick(BASE_SPELLS);
  f.spells.push({ id: sp, lvl: skillRank('a4') ? 2 : 1, cd: 0 });
  f.cards[sp] = f.spells[0].lvl;
  return f;
}
const xpForLevel = (n) => Math.round(8 + n * 6 + Math.pow(n, 1.55) * 2);

const HeroMixin = {
  recalc() {
    const d = this.hdef, c = this.cards;
    const lv = (k) => c[k] || 0;
    const oldMax = this.maxHp || 0;
    this.maxHp = Math.round((d.hp + skillRank('g1') * 10 + lv('heartUp') * 20) * (SAVE.settings.assist ? 1.3 : 1));
    this.maxMp = d.mp + skillRank('a1') * 12 + lv('manaCrystal') * 15;
    if (oldMax && this.maxHp > oldMax) this.hp += this.maxHp - oldMax;
    const wd = lv('wpn_dmg'), ws = lv('wpn_speed'), wr = lv('wpn_reach');
    this.stats = {
      dmgMul: 1 + skillRank('m1') * 0.06 + lv('might') * 0.08,
      wpnMul: 1 + wd * 0.18,
      spellMul: 1 + skillRank('a3') * 0.12,
      critChance: 0.05 + skillRank('m2') * 0.03 + lv('lucky') * 0.06,
      critMul: 1.8,
      speedMul: 1 + lv('boots') * 0.08,
      atkSpeed: 1 + ws * 0.12,
      reach: 1 + wr * 0.15,
      blockMul: 0.2 - skillRank('g2') * 0.05,
      foodMul: 1 + skillRank('g3') * 0.25,
      regen: skillRank('g4') * 0.6,
      mpRegen: d.mpRegen * (1 + skillRank('a2') * 0.12 + lv('manaCrystal') * 0.2),
      lifesteal: lv('vampire') * 0.02,
      thorns: lv('thorns') ? 0.2 + lv('thorns') * 0.2 : 0,
      magnet: 90 * (1 + lv('magnet') * 0.6),
      xpMul: 1 + skillRank('f2') * 0.08,
      qMul: 1 + skillRank('f1') * 0.1,
      finisherMul: 1 + skillRank('m3') * 0.2,
      berserk: skillRank('m4') * 0.15,
      odRate: 1 + skillRank('a5') * 0.25,
      echo: lv('echo') * 0.12,
      cdMul: c.duo_deja ? 0.75 : 1,
    };
    this.speed = d.speed * this.stats.speedMul;
    // weapon tier visuals
    this.wpnLevel = Object.keys(WEAPON_CARDS).reduce((a, k) => a + lv(k), 0);
    const tier = this.wpnLevel >= 6 ? 3 : this.wpnLevel >= 3 ? 2 : 1;
    if (tier !== this.wpnTier && this.level > 1) {
      Floaters.add(this.x, scrY(this.z, 150), 'WEAPON UP!', { color: '#ffc53d', size: 26, life: 1.4 });
      Floaters.add(this.x, scrY(this.z, 120), this.weaponType.names[tier - 1], { color: '#fff', size: 16, font: FONT_BODY, life: 1.4 });
      Sfx.play('levelup');
      if (tier === 3) unlockAch('wpnmax');
    }
    this.wpnTier = tier;
    const wt = this.weaponType;
    this.look.wpnTier = tier;
    this.look.wpnColor = wt.colors[tier - 1];
    this.look.wpnGlow = wt.glow[tier - 1] || (c.wpn_fire ? '#ff7a2f' : c.wpn_ice ? '#7fe3ff' : c.wpn_storm ? '#ffe45c' : c.wpn_time ? '#c58cff' : null);
    if (this.hdef.weapon === 'gauntlets') this.look.gloves = wt.colors[tier - 1];
    if (this.mp > this.maxMp) this.mp = this.maxMp;
  },
  baseDmg() {
    const wt = this.weaponType;
    return (wt.dmg[0] + (this.hdef.id === 'bruno' ? 3 : 0)) * this.stats.wpnMul;
  },
  heal(n, quiet) {
    if (this.dead) return;
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + n);
    if (!quiet && this.hp > before) for (let i = 0; i < 8; i++) Particles.add({ x: this.x + R(-20, 20), y: scrY(this.z, R(10, 90)), vy: R(-80, -30), life: 0.8, size: 4, color: '#3ee6a8', type: 'star' });
  },
  gainXp(n) {
    const rank = comboRank(S.combo);
    this.xp += n * this.stats.xpMul * (1 + rank.bonus);
    while (this.xp >= this.xpNext) {
      this.xp -= this.xpNext;
      this.level++;
      this.xpNext = xpForLevel(this.level);
      S.pendingLevels++;
      if (this.level >= 15) unlockAch('lvl15');
    }
  },
  addOverdrive(n) {
    if (this.overdrive > 0) return;
    this.od = Math.min(100, this.od + n * 0.35 * this.stats.odRate);
  },
  triggerOverdrive() {
    if (this.od < 100 || this.overdrive > 0 || this.dead) return;
    this.od = 0; this.overdrive = 6;
    Sfx.play('overdrive'); S.shake(10);
    S.banner('OVERDRIVE!', '#ffc53d', 1.2);
    Sfx.setMusicRate(1.25);
    unlockAch('overdrive');
    for (let i = 0; i < 40; i++) Particles.add({ x: this.x, y: scrY(this.z, 50), vx: R(-500, 500), vy: R(-500, 300), life: 0.8, size: 6, color: pick(['#ffc53d', '#fff4c2']), glow: true });
  },
  tickHero(dt) {
    if (this.dead) return;
    this.mp = Math.min(this.maxMp, this.mp + this.stats.mpRegen * dt);
    if (this.stats.regen) this.heal(this.stats.regen * dt, true);

function heroControl(h, dt) {
  if (h.dead) return;
  const P = Input.pressed, H = Input.held;
  const mv = Input.moveVec();
  if (P.od) h.triggerOverdrive();
  // LF2 style D→A / D↑A / D↓A, or direct spell buttons
  let slot = null;
  const sp = Input.consumeSpecial();
  if (sp) slot = sp.slot;
  if (P.s1) slot = 's1'; else if (P.s2) slot = 's2'; else if (P.s3) slot = 's3';
  const free = h.canAct() && h.st.frozen <= 0;
  if (slot && (free || h.state === 'attack' && h.stateT > (h.move ? h.move.windup + h.move.active : 0))) {
    if (sp && sp.dir) h.face = sp.dir;
    else if (mv.x) h.face = sign(mv.x);
    if (castSpell(h, { s1: 0, s2: 1, s3: 2 }[slot])) return;
  }
  if (h.state === 'attack') {
    if (P.atk) h.buffer = 0.3;
    return;
  }
  if (h.state === 'jump') {
    // air control
    h.vx = approach(h.vx, mv.x * h.speed * (h.runJump ? 1.7 : 1), 900 * dt);
    h.vz = mv.z * h.speed * 0.5;
    if (P.atk && !h.airAtk) { h.airAtk = true; h.startMove('flykick'); h.vz = 0; return; }
    if (P.jump && h.cards.doubleJump && h.jumps < 2) { h.jumps = 2; h.vy = 520; Sfx.play('jump'); Particles.add({ x: h.x, y: scrY(h.z, h.y), type: 'ring', size: 30, life: 0.3, color: '#fff' }); }
    return;
  }
  if (!free) return;
  if (h.held) {
    // carrying something
    h.anim = 'hold';
    if (P.atk) { throwHeld(h); return; }
    const sp2 = h.speed * 0.75;
    h.vx = mv.x * sp2; h.vz = mv.z * sp2 * 0.65; h.moving = !!(mv.x || mv.z);
    if (mv.x) h.face = sign(mv.x);
    if (h.moving) h.walkPhase += dt * 10;
    if (P.jump) { h.held.dead = false; dropHeld(h); }
    return;
  }
  if (P.atk && nearMerchant(S, h)) { UI.shop(); return; }
  if (P.atk) {
    const prop = !mv.x && !mv.z ? nearbyProp(h) : null;
    if (prop) { liftProp(h, prop); return; }
    if (h.state === 'run') { h.startMove('dashpunch'); h.comboStep = h.weaponType.combo.length - 1; return; }
    h.comboStep = 0;
    h.startMove(h.weaponType.combo[0]);
    if (mv.x) h.face = sign(mv.x);
    return;
  }
  if (P.jump) {
    h.setState('jump');
    h.vy = 600; h.jumps = 1; h.airAtk = false;
    h.runJump = h.state === 'run' || mv.run;
    if (mv.run) h.vx = mv.x * h.speed * 1.7;
    Sfx.play('jump'); dust(h.x, h.z, 4);
    return;
  }
  if (H.def) {
    if (h.state !== 'block') h.setState('block');
    h.vx *= 0.5; h.vz = 0;
    if (mv.x) h.face = sign(mv.x);
    return;
  } else if (h.state === 'block') h.setState('idle');
  // movement
  const running = mv.run && mv.x !== 0;
  const spd = h.speed * (running ? 1.75 : 1);
  h.vx = mv.x * spd; h.vz = mv.z * h.speed * 0.66;
  if (mv.x) h.face = sign(mv.x);
  if (mv.x || mv.z) {
    const st = running ? 'run' : 'walk';
    if (h.state !== st) { h.state = st; h.anim = st; }
    const prev = h.walkPhase;
    h.walkPhase += dt * (running ? 15 : 10);
    if (Math.floor(prev / Math.PI) !== Math.floor(h.walkPhase / Math.PI)) { Sfx.play('step'); if (running) dust(h.x - h.face * 10, h.z, 1); }
  } else if (h.state === 'walk' || h.state === 'run') { h.state = 'idle'; h.anim = 'idle'; }
}
function nearbyProp(h) {
  let best = null, bd = 60;

// ============================================================
const SEC_W = 1150;
const COMBO_RANKS = [
  { n: 0, r: '', c: '#fff', bonus: 0 }, { n: 8, r: 'D', c: '#c9c3de', bonus: 0.05 }, { n: 15, r: 'C', c: '#3ee6a8', bonus: 0.1 },
  { n: 25, r: 'B', c: '#55c8ff', bonus: 0.15 }, { n: 40, r: 'A', c: '#b77cff', bonus: 0.2 }, { n: 60, r: 'S', c: '#ffc53d', bonus: 0.3 },
  { n: 85, r: 'SS', c: '#ff7a2f', bonus: 0.4 }, { n: 120, r: 'SSS', c: '#ff4f73', bonus: 0.5 },
];
const RANK_WORDS = { D: 'Decent', C: 'Cool', B: 'Bravo', A: 'Awesome', S: 'Stylish', SS: 'Sensational', SSS: 'SUPERSONIC' };
function comboRank(n) { let r = COMBO_RANKS[0]; for (const c of COMBO_RANKS) if (n >= c.n) r = c; return r; }

class Stage {
  constructor(o) {

    this.level = o.level;
    this.heroId = o.heroId;
    this.bot = !!o.bot;
    this.onEnd = o.onEnd;

    this.combo = 0; this.comboT = 0; this.maxCombo = 0; this.kills = 0; this.quarters = 0; this.dmgDealt = 0; this.tookDamage = false;
    this.heroes = []; this.enemies = []; this.projs = []; this.zones = []; this.pickups = []; this.props = []; this.decals = [];
    this.bolts = []; this.afterimages = []; this.clones = []; this.spawnQ = []; this.banners = [];
    this.engaged = new Set();
    this.pendingLevels = 0; this.pendingChests = 0; this.inDraft = false; this.paused = false; this.over = false;
    this.god = !!Game.cheats.god; this.noclip = !!Game.cheats.noclip;
    this.letterbox = 0; this.bossIntro = null; this.bosses = [];
    this.wave = 0; this.revivesUsed = 0; this.cheated = !!Game.cheatedRun;
    const L = this.mode === 'endless' ? 3 : this.level.n;
    this.setDifficulty(L);
    this.sections = this.mode === 'endless' || this.mode === 'demo' ? 1 : this.level.sections;
    this.stageLen = this.sections * SEC_W;
    this.secIdx = 0;
    this.arena = [0, SEC_W];
    this.unlocked = false;
    const biome = this.level.biome;
    this.bg = createBackground(biome, hashStr(this.level.id || 'x') + 7, this.level.night);
    this.bg.placeProps(this.mode === 'endless' || this.mode === 'demo' ? 6000 : this.stageLen);
    this.hero = o.carry ? carryHero(o.carry, 180, DEPTH * 0.55) : makeHero(this.heroId, 180, DEPTH * 0.55);
    this.heroes.push(this.hero);
    this.mods = o.mods || {};
    if (this.mods.hpMul) this.hpMul *= this.mods.hpMul;
    if (this.mods.elite) this.eliteChance += this.mods.elite;
    if (Game.cheats.idkfa) { for (const s of this.hero.spells) s.lvl = 5; this.hero.cards[this.hero.spells[0].id] = 5; }
    this.camX = 0;
    this.maxEngaged = 2 + Math.floor(L / 4);
    // warm-up kit: later levels start with free upgrade picks so the build fits the difficulty
    if (this.mode === 'level' && !o.noKit) {
      const kit = Math.floor(L / 2);
      this.pendingLevels = kit; this.hero.level += kit; this.hero.xpNext = xpForLevel(this.hero.level);
      this.warmup = this.bot ? 0 : kit;
    }
    if (this.mods.chest) this.pendingChests++;
    this.startSection(0);
    if (this.mode !== 'demo') Sfx.playMusic(this.mode === 'endless' ? 'boss' : BIOMES[biome].music);
    this.intro = 1.6;
    this.banner(this.mode === 'endless' ? 'ENDLESS COLOSSEUM' : this.mode === 'demo' ? '' : `LEVEL ${this.level.n} · ${this.level.name.toUpperCase()}`, '#fff', 1.8, true);
  }
  setDifficulty(L) {
    this.diff = L;
    this.hpMul = 1 + 0.24 * (L - 1);
    this.dmgMul = 1 + 0.085 * (L - 1);
    this.spdMul = 1 + 0.025 * (L - 1);
    this.aggr = 1 + 0.045 * (L - 1);
    if (SAVE.settings.assist) { this.hpMul *= 0.8; this.dmgMul *= 0.6; this.aggr *= 0.85; }
    this.eliteChance = L >= 3 ? 0.03 + L * 0.008 : 0;
  }
  bounds(f) {
    const a = this.arena;
    if (f.isHero) return this.noclip ? [a[0] + 10, a[1] - 10] : [a[0] + 20, a[1] - 20];
    if (f.entering) return [a[0] - 260, a[1] + 260];
    return [a[0] + 10, a[1] - 10];
  }
  inChrono(o) {
    for (const z of this.zones) if (z.chrono && !z.dead && z.contains(o, 10)) return true;
    return false;
  }
  shake(n) { if (SAVE.settings.shake) this.shakeAmt = Math.max(this.shakeAmt, n); }
  banner(text, color, dur, big) { if (text) this.banners.push({ text, color, t: 0, dur: dur || 1.2, big }); }
  addProj(p) { this.projs.push(p); return p; }
  addZone(z) { this.zones.push(z); return z; }
  addPickup(p) { this.pickups.push(p); return p; }
  addDecal(d) { d.t = 0; this.decals.push(d); }
  telegraph(o) {
    const z = new Zone(Object.assign({ life: o.life || 0.15, kind: o.kind || 'burst' }, o));
    if (o.meteor) {
      z.onDrawTop = true;
    }
    return this.addZone(z);
  }

  // ---------------- waves ----------------
  startSection(i) {
    this.secIdx = i;
    const start = i * SEC_W;
    this.arena = [start, start + SEC_W];
    this.unlocked = false;
    this.waves = [];
    const L = this.diff;
    if (this.mode === 'demo' || this.mode === 'typing') { this.waves = []; this.waveIdx = 0; return; }
    if (this.mode === 'endless') { this.nextEndlessWave(); return; }
    const last = i === this.sections - 1;
    const nW = last ? 1 + (L >= 6 ? 1 : 0) : 2 + (i > 0 && L >= 3 ? 1 : 0);
    for (let w = 0; w < nW; w++) {
      const n = Math.round(3 + L * 0.45 + i * 0.8 + w * 0.6);
      const list = [];
      for (let k = 0; k < n; k++) list.push(weightedPick(this.level.pool, (p) => p[1])[0]);
      this.waves.push(list);
    }
    if (last) this.waves.push('BOSS');
    // breakables in this section
    const r = makeRng(hashStr(this.level.id) + i * 31);
    const np = 2 + r.int(0, 2);
    for (let k = 0; k < np; k++) this.props.push(new Prop({ kind: r.pick(['barrel', 'crate', 'barrel', 'rock']), x: start + r.range(200, SEC_W - 150), z: r.range(20, DEPTH - 20), hp: 24 }));
    // one golden floppy hides in a breakable somewhere in each world level
    if (LEVEL_BY_ID[this.level.id] && !SAVE.floppies[this.level.id] && hashStr(this.level.id) % Math.max(1, this.sections - 1) === i) {
      this.props.push(new Prop({ kind: 'crate', x: start + r.range(260, SEC_W - 200), z: r.pick([12, DEPTH - 12]), hp: 30, floppy: true }));
    }
    // rare event: a Loot Goblin sprints through with a sack of quarters
    if (!this.gobSeen && !last && this.mode === 'level' && Math.random() < 0.22) {
      this.gobSeen = true;
      this.spawnQ.push({ t: R(4, 9), fn: () => { this.spawnEnemy('lootgob', { edge: true }); this.banner('LOOT GOBLIN!', '#ffc53d', 1.4); Sfx.play('coin'); } });
    }
    this.waveIdx = 0;
    this.waveCooldown = i === 0 ? 1.4 : 0.6;
  }
  nextEndlessWave() {
    this.wave++;
    const w = this.wave;
    this.setDifficulty(1 + w * 0.55);
    this.maxEngaged = 2 + Math.floor(w / 3);
    const pool = Object.keys(ENEMIES).filter((k) => k !== 'cow');
    const tierPool = pool.slice(0, Math.min(pool.length, 4 + w));
    const list = [];
    const n = 4 + Math.floor(w * 1.2);
    for (let k = 0; k < n; k++) list.push(pick(tierPool));
    this.waves = [list];
    if (w % 5 === 0) {
      const bossList = ['bigmike', 'twinhood', 'worm', 'frostknight', 'forgegolem', 'mimic', 'grumble', 'pharaoh', 'yeti'];
      this.waves.push('ENDLESSBOSS:' + bossList[Math.min(bossList.length - 1, w / 5 - 1)]);
    }
    this.waveIdx = 0; this.waveCooldown = 1.5;
    this.banner('WAVE ' + w, '#ffc53d', 1.2);
    if (w >= 10) unlockAch('endless10');
  }
  spawnEnemy(kind, o = {}) {
    const def = ENEMIES[kind];
    if (!def) return;
    const doSpawn = () => {
      if (this.over) return;
      const side = o.side || (Math.random() < 0.5 ? -1 : 1);
      const elite = o.elite || Math.random() < this.eliteChance;
      let x = side < 0 ? this.arena[0] - 80 : this.arena[1] + 80;
      const z = o.z ?? R(10, DEPTH - 10);
      const e = new Fighter({ team: 'enemy', kind, def, x, z, hp: def.hp * this.hpMul, dmg: def.dmg * this.dmgMul, speed: def.speed * this.spdMul, ai: def.ai, face: -side, scale: def.scale || 1 });
      e.entering = true;
      // some enemies make a dramatic entrance inside the arena
      if (!o.edge && (kind === 'skeleton' || kind === 'mummy') && Math.random() < 0.5) { e.x = R(this.arena[0] + 100, this.arena[1] - 100); e.entering = false; e.setState('spawn'); dust(e.x, e.z, 10); }
      if (!o.edge && kind === 'slime' && Math.random() < 0.5) { e.x = R(this.arena[0] + 100, this.arena[1] - 100); e.entering = false; e.y = 400; e.setState('air'); e.vy = 0; }
      if (elite && kind !== 'lootgob') this.makeElite(e);
      if (kind === 'lootgob') { e.maxHp = e.hp = def.hp * (1 + 0.12 * (this.diff - 1)); }
      this.enemies.push(e);

    };

  }
  makeElite(e) {
    const mod = pick(['shielded', 'swift', 'vampiric', 'explosive', 'giant']);
    e.mods.push(mod);
    e.isElite = true;
    e.maxHp *= 1.8; e.hp = e.maxHp;
    e.xpMul = 3;
    if (mod === 'shielded') e.shield = e.maxHp * 0.4;
    if (mod === 'swift') e.speed *= 1.5;
    if (mod === 'giant') { e.scale *= 1.3; e.w *= 1.3; e.h *= 1.3; e.maxHp *= 1.5; e.hp = e.maxHp; e.dmg *= 1.3; e.weight *= 1.5; }
  }
  spawnBoss(id, opts = {}) {
    const def = BOSSES[id];
    const mk = (x, z, hpFrac) => {
      const L = this.diff;

  // ---------------- update ----------------
  update(dtReal) {
    let dt = Math.min(dtReal, 1 / 30);

    if (this.shakeAmt > 0) this.shakeAmt = Math.max(0, this.shakeAmt - dtReal * 40);
    if (this.flashRed > 0) this.flashRed -= dtReal;
    if (this.flashWhite > 0) this.flashWhite -= dtReal;
    this.bolts = this.bolts.filter((b) => (b.t -= dtReal) > 0);

    if (this.hitstop > 0) { this.hitstop -= dtReal; this.updateCamera(dtReal); return; }

    if (this.over === 'win' && !h.dead && h.canAct()) { h.state = 'win'; h.anim = 'win'; h.vx = 0; h.vz = 0; }
    h.tickHero(dt);
    // AI
    if (!this.bossIntro) for (const e of this.enemies) {
      enemyThink(e, dt);
      if (e.pendingShot) { e.pendingShot.t -= dt * e.ts; if (e.pendingShot.t <= 0) { if (!e.dead && e.state === 'cast') enemyShoot(e, e.pendingShot.kind, h); e.pendingShot = null; } }
      if (e.state === 'block') { e.blockT -= dt; if (e.blockT <= 0) { e.setState('idle'); e.blockHits = 0; } }
    }
    // physics & states

    this.resolveMelee();
    for (const p of this.projs) p.update(dt);
    for (const z of this.zones) z.update(dt);
    for (const p of this.pickups) p.update(dt);
    for (const p of this.props) p.update(dt);
    for (const d of this.decals) d.t += dt;

    this.zones = this.zones.filter((z) => !z.dead);
    this.pickups = this.pickups.filter((p) => !p.dead);
    this.props = this.props.filter((p) => !p.dead || p.held);
    this.decals = this.decals.filter((d) => d.t < d.life);
    this.enemies = this.enemies.filter((e) => { if (e.remove) { this.engaged.delete(e.id); return false; } return true; });
    for (const id of this.engaged) if (!this.enemies.find((e) => e.id === id && !e.dead)) this.engaged.delete(id);
    // combo decay

    if (this.combo >= 75) unlockAch('combo75');

  separate() {
    const all = this.enemies;
    const h = this.hero;
    for (let i = 0; i < all.length; i++) {
      const a = all[i];
      if (a.dead || a.hidden) continue;
      for (let j = i + 1; j < all.length; j++) {
        const b = all[j];
        if (b.dead || b.hidden) continue;
        const dx = b.x - a.x, dz = (b.z - a.z) * 1.6;
        const min = (a.w + b.w) * 0.42;
        const d2 = dx * dx + dz * dz;
        if (d2 < min * min && d2 > 0.01) {
          const d = Math.sqrt(d2), push = (min - d) * 0.5;
          const nx = dx / d, nz = dz / d / 1.6;
          const wa = a.isBoss ? 0.1 : 1, wb = b.isBoss ? 0.1 : 1;
          a.x -= nx * push * wa; a.z -= nz * push * wa; b.x += nx * push * wb; b.z += nz * push * wb;
        }
      }
      // hero vs enemy (soft; noclip cheat disables)
      if (!this.noclip && !h.dead && h.y < 30 && a.y < 30 && a.state !== 'down' && a.state !== 'air') {
        const dx = h.x - a.x, dz = (h.z - a.z) * 1.6;
        const min = (a.w + h.w) * 0.4;

          const d = Math.sqrt(d2), push = (min - d);

          a.x -= (dx / d) * push * (1 - w); a.z -= (dz / d / 1.6) * push * (1 - w);

      const targets = a.team === 'hero' ? this.enemies : this.heroes;
      for (const t of targets) {
        if (t.dead || a.hitIds.has(t.id) || t.hidden) continue;
        if (!t.overlaps(box.x0, box.x1, box.y0, box.y1, box.z, box.zr)) continue;
        a.hitIds.add(t.id);
        const m = a.move;
        let dmg = a.isHero ? this.heroMoveDmg(a, m) : a.dmg * (m.dmg || 1);
        dealDamage(a, t, { dmg, el: 'phys', kx: m.kx, ky: m.ky, fall: m.fall, stop: m.stop, sfx: m.sfx, melee: true, finisher: m.finisher, heavy: m.finisher, dir: a.face });

        if (p.x < box.x0 - p.r || p.x > box.x1 + p.r || Math.abs(p.z - box.z) > box.zr + 12 || p.y < box.y0 - 20 || p.y > box.y1 + 20) continue;
        p.dead = true;

function heroElements(h) {
  const els = new Set();
  for (const s of h.spells) els.add(SPELLS[s.id].el);
  for (const k of ['wpn_fire', 'wpn_ice', 'wpn_earth', 'wpn_storm', 'wpn_time']) if (h.cards[k]) els.add(k.slice(4));
  for (const k in PASSIVES) if (h.cards[k] && PASSIVES[k].el !== 'phys') els.add(PASSIVES[k].el);
  return els;
}
function makeDraft(h, chest) {
  const c = h.cards;
  const pool = [];
  const luck = 1 + skillRank('f4') * 0.25 + (chest ? 2 : 0);
  // spells
  for (const id of BASE_SPELLS) {
    const def = SPELLS[id];
    const owned = h.spells.find((s) => s.id === id);
    if (owned) {
      if (owned.lvl < 5) pool.push({ id, kind: 'spellUp', rarity: def.rarity, w: 1.3, lvl: owned.lvl + 1 });
      else if (def.evolve && !h.spells.find((s) => s.id === def.evolve)) pool.push({ id: def.evolve, base: id, kind: 'evolve', rarity: 'legendary', w: 3 });
    } else if (h.spells.length < 3) pool.push({ id, kind: 'spellNew', rarity: def.rarity, w: 0.8, lvl: 1 });
  }
  for (const id in PASSIVES) { const d = PASSIVES[id]; if ((c[id] || 0) < d.max) pool.push({ id, kind: 'passive', rarity: d.rarity, w: 1, lvl: (c[id] || 0) + 1 }); }
  for (const id in WEAPON_CARDS) { const d = WEAPON_CARDS[id]; if ((c[id] || 0) < d.max) pool.push({ id, kind: 'weapon', rarity: d.rarity, w: id.startsWith('wpn_') && d.max === 1 ? 0.6 : 1.1, lvl: (c[id] || 0) + 1 }); }
  const els = heroElements(h);
  for (const id in DUOS) { const d = DUOS[id]; if (!c[id] && d.els.every((e) => els.has(e))) pool.push({ id, kind: 'duo', rarity: 'epic', w: 2.5 }); }
  const n = skillRank('f5') ? 4 : 3;
  const out = [];
  const rw = (card) => RARITY[card.rarity].w * card.w * (card.rarity !== 'common' ? luck : chest ? 0.3 : 1);
  while (out.length < n && pool.length) {
    const card = weightedPick(pool, rw);
    out.push(card);
    pool.splice(pool.indexOf(card), 1);
  }
  while (out.length < n) out.push(out.length % 2 ? { id: 'quarters', kind: 'filler', rarity: 'common' } : { id: 'milk', kind: 'filler', rarity: 'common' });
  // Glitch hero: one card is always a total surprise
  if (h.hdef.id === 'glitch' && out.length) out[out.length - 1].glitched = true;
  return out;
}
function cardInfo(card) {
  switch (card.kind) {
    case 'spellUp': case 'spellNew': { const d = SPELLS[card.id]; return { name: d.name, icon: d.icon, color: EL[d.el].c, el: d.el, desc: d.desc(card.lvl), tag: card.kind === 'spellNew' ? 'NEW SPELL · ' + d.input : 'SPELL', lvl: card.lvl }; }
    case 'evolve': { const d = SPELLS[card.id]; return { name: d.name, icon: d.icon, color: EL[d.el].c, el: d.el, desc: d.desc(), tag: 'EVOLUTION', lvl: null }; }
    case 'passive': { const d = PASSIVES[card.id]; return { name: d.name, icon: d.icon, color: EL[d.el].c === '#ffffff' ? '#ffc53d' : EL[d.el].c, el: d.el, desc: d.desc(card.lvl), tag: 'RELIC', lvl: card.lvl }; }
    case 'weapon': { const d = WEAPON_CARDS[card.id]; return { name: d.name, icon: d.icon, color: d.el ? EL[d.el].c : '#c9c3de', el: d.el || 'phys', desc: d.desc(), tag: 'WEAPON', lvl: card.lvl }; }
    case 'duo': { const d = DUOS[card.id]; return { name: d.name, icon: d.icon, color: '#b77cff', el: d.els.join('+'), desc: d.desc(), tag: 'DUO · ' + d.els.map((e) => EL[e].name).join(' + '), lvl: null }; }
    case 'filler': { const d = FILLER[card.id]; return { name: d.name, icon: d.icon, color: '#3ee6a8', desc: d.desc(), tag: 'SNACK', lvl: null }; }
  }
}
function applyCard(h, card) {
  if (card.glitched) {
    // the glitch card rolls something random from the whole pool
    const alt = makeDraft(Object.assign(Object.create(Object.getPrototypeOf(h)), h, { hdef: HEROES.rook }), false);
    card = pick(alt);
    Floaters.add(h.x, scrY(h.z, 160), 'GL1TCH3D!', { color: '#ff3df2', size: 20 });
  }
  const c = h.cards;
  switch (card.kind) {
    case 'spellNew': h.spells.push({ id: card.id, lvl: 1, cd: 0 }); c[card.id] = 1; break;
    case 'spellUp': { const s = h.spells.find((x) => x.id === card.id); if (s) s.lvl++; c[card.id] = s ? s.lvl : 1; break; }
    case 'evolve': {
      const s = h.spells.find((x) => x.id === card.base);
      if (s) { s.id = card.id; s.lvl = 6; s.cd = 0; }
      c[card.id] = 1;
      unlockAch('evolve');
      S.banner('EVOLVED: ' + SPELLS[card.id].name.toUpperCase(), '#ffc53d', 1.6);
      break;
    }
    case 'passive': case 'weapon': c[card.id] = (c[card.id] || 0) + 1; break;
    case 'duo': c[card.id] = 1; break;
    case 'filler': if (card.id === 'milk') h.heal(h.maxHp * 0.4); else S.quarters += 25; break;
  }
  if (card.id === 'heartUp') h.heal(20);
  h.recalc();
  Sfx.play('levelup');
  for (let i = 0; i < 30; i++) Particles.add({ x: h.x + R(-30, 30), y: scrY(h.z, R(0, 120)), vy: R(-200, -60), vx: R(-40, 40), life: 0.9, size: 5, color: pick(['#ffc53d', '#3ee6a8', '#fff']), type: 'star' });
}

// Tap it five times to reveal the Keyboard Warrior special mode.
const CLOUD_LINES = ['Hehe!', 'That tickles!', 'Stop it!', 'Okay, okay…', 'Fine! A secret for you!'];

  start() {

    if (SAVE.secrets.typing) { Sfx.play('gem'); this.say(pick(CLOUD_GIGGLES)); return; }
    this.taps++;
    Sfx.play(this.taps < 5 ? 'gem' : 'cheat');
    this.say(CLOUD_LINES[Math.min(this.taps, 5) - 1]);
    if (this.taps >= 5) {
      SAVE.secrets.typing = true; persist();
      for (let i = 0; i < 30; i++) this.sparks.push({ x: 60, y: 46, vx: R(-140, 140), vy: R(-160, 60), t: 1.1, c: pick(['#ffc53d', '#3ee6a8', '#ff4f73', '#55c8ff']) });

  update(dt) {

    if (win && acc >= 98) unlockAch('acc98');

    const weakNow = Object.keys(this.keyMiss).sort((a, b) => this.keyMiss[b] - this.keyMiss[a]).slice(0, 3);
    const idx = LESSONS.indexOf(this.lesson);

      unlocks: win && acc >= 85 && next && !(rec.acc >= 85 && rec.prevUnlocked) ? ['Next lesson: ' + next.name] : [],
      tip: acc < 90 ? 'Slow down a little. Accuracy first, speed follows on its own.' : wpm < 20 ? 'Great accuracy! Now try to keep a steady rhythm.' : 'Excellent. Take a short break, then try the next lesson. Short, spaced sessions train best.',
      buttons: [
        { label: 'Retry', fn: () => { Game.stopStage(); UI.heroes((hero) => Typing.start(this.lesson, hero), 'Choose your warrior', () => Typing.menu()); } },
        win && next && acc >= 85 ? { label: 'Next lesson', cls: 'gold', fn: () => { Game.stopStage(); UI.heroes((hero) => Typing.start(next, hero), 'Choose your warrior', () => Typing.menu()); } } : null,

function weakKeys(n) {
  const hit = SAVE.typing.keyHit, miss = SAVE.typing.keyMiss;
  return Object.keys(miss).filter((k) => /[a-z]/.test(k) && miss[k] >= 2).sort((a, b) => miss[b] / ((hit[b] || 0) + miss[b]) - miss[a] / ((hit[a] || 0) + miss[a])).slice(0, n);
}
function buildLessonWords(L) {
  const n = L.words;
  if (L.list) return shuffle(L.list.slice()).concat(shuffle(L.list.slice())).slice(0, n);
  const allowed = new Set(L.keys.split(''));
  let pool = (L.keys === 'asdfghjkl' || L.keys === 'asdf' ? HOME_WORDS.concat(DICT) : DICT).filter((w) => w.split('').every((c) => allowed.has(c)));
  if (L.focus) pool = pool.filter((w) => w.split('').some((c) => L.focus.includes(c)));
  // pseudo-word drills when the real vocabulary is thin (e.g. right-hand home row)
  const keys = L.keys.split('');
  while (pool.length < 12) {
    const len = RI(2, 4);
    let w = '';
    for (let i = 0; i < len; i++) w += pick(keys);
    pool.push(w);
  }
  // weight towards the player's weakest keys
  const weak = weakKeys(3);
  const out = [];
  for (let i = 0; i < n; i++) {
    const w = weightedPick(pool, (x) => 1 + weak.filter((k) => x.includes(k)).length * 2 + (x.length > 6 && i < n / 3 ? -0.5 : 0));
    out.push(w);
  }
  return out;
}

// ---------------- bot (title demo + automated tests) ----------------
function botControl(h, dt) {
  if (h.dead) return;
  const e = nearestEnemy(h.x, h.z, 3000);
  h.botT = (h.botT || 0) - dt;
  if (h.state === 'attack') { if (e && Math.abs(e.x - h.x) < 90 && Math.abs(e.z - h.z) < 26) h.buffer = 0.3; return; }
  if (h.od >= 100) h.triggerOverdrive();
  if (!h.canAct()) return;
  if (!e) {
    if (S.unlocked) { h.vx = h.speed; h.face = 1; h.state = 'walk'; h.anim = 'walk'; h.walkPhase += dt * 10; }
    else { h.vx = 0; h.vz = 0; h.state = 'idle'; h.anim = 'idle'; }
    return;
  }
  const dx = e.x - h.x, dz = e.z - h.z;
  h.face = sign(dx) || 1;
  // block incoming melee wind-ups
  const threat = S.enemies.find((o) => !o.dead && o.state === 'attack' && o.move && o.stateT < o.move.windup && Math.abs(o.x - h.x) < 130 * o.scale && Math.abs(o.z - h.z) < 34);
  if (threat && Math.random() < 0.85) { h.face = sign(threat.x - h.x) || 1; if (h.state !== 'block') h.setState('block'); h.vx = 0; h.vz = 0; return; }
  if (h.state === 'block') h.setState('idle');
  // cast spells now and then
  if (h.botT <= 0) {
    h.botT = R(0.8, 2);
    const i = RI(0, h.spells.length - 1);
    if (Math.abs(dx) < 420 && castSpell(h, i)) return;
  }
  // sidestep incoming projectiles in our lane
  const shot = S.projs.find((p) => p.team === 'enemy' && Math.abs(p.z - h.z) < 26 && Math.abs(p.x - h.x) < 260 && sign(p.vx) === sign(h.x - p.x));
  if (shot) { h.vz = (h.z > DEPTH / 2 ? -1 : 1) * h.speed * 0.66; h.vx = 0; h.state = 'walk'; h.anim = 'walk'; h.walkPhase += dt * 10; return; }
  // dodge danger zones
  const danger = S.zones.find((z) => z.team === 'enemy' && z.t < z.delay && z.contains(h, 20));
  if (danger) { h.vz = (h.z > danger.z ? 1 : -1) * h.speed * 0.66; h.vx = -sign(dx) * h.speed * 0.5; h.state = 'walk'; h.anim = 'walk'; h.walkPhase += dt * 10; return; }
  if (Math.abs(dx) < 66 * h.stats.reach && Math.abs(dz) < 16) {
    h.comboStep = 0; h.startMove(h.weaponType.combo[0]);
    return;
  }
  const tx = e.x - sign(dx) * 50, sp = h.speed;
  const d = Math.hypot(tx - h.x, dz);
  h.vx = ((tx - h.x) / (d || 1)) * sp; h.vz = (dz / (d || 1)) * sp * 0.66;
  h.state = 'walk'; h.anim = 'walk'; h.walkPhase += dt * 10;
}

// ---------------- main loop ----------------
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  try {
    if (Input.pressed.pause && Game.state === 'play' && S) { if (S.paused) UI.resume(); else if (!S.inDraft && !S.over) UI.pause(); }
    const running = Game.stage && S && !S.paused && !S.inDraft && (Game.state === 'play' || Game.state === 'title');
    if (running) {
      S.update(dt);
      if (S && S.mode === 'typing') Typing.update(dt);
    }
    if (Game.state === 'play') {
      SAVE.stats.playTime += dt;
      // adaptive resolution: if we can't hold ~45 fps for a few seconds, render at a lower pixel ratio
      const P = Game.perf || (Game.perf = { t: 0, n: 0, slow: 0 });
      P.t += dt; P.n++;
      if (P.t >= 3) {
        const avg = P.t / P.n;
        P.slow = avg > 0.022 && !S.paused ? P.slow + 1 : 0;
        P.t = 0; P.n = 0;
        if (P.slow >= 1 && View.dpr > 1) { View.qualityCap = Math.max(1, View.dpr - 0.35); resize(); if (S && S.bg) S.bg.build(); }
      }
    }
    const showGame = Game.stage && S && UI.current !== 'scrMap' && UI.current !== 'scrHeroes' && UI.current !== 'scrSkills' && UI.current !== 'scrTrophies' && UI.current !== 'scrSettings' && UI.current !== 'scrTypingMenu';
    if (showGame) {
      ctx.setTransform(View.scale, 0, 0, View.scale, 0, 0);
      S.draw();
      if (S.mode === 'typing') { Typing.drawWords(); Typing.drawHUD(); }
    }
    if (Game.state === 'play' && S && !S.paused) updateTouchButtons();
  } catch (err) {
    console.error(err);
    if (!Game.errShown) { Game.errShown = true; toast('Oops, a bug!', String(err.message || err).slice(0, 80), '!'); }
  }
  Input.endFrame();
  requestAnimationFrame(frame);
}
