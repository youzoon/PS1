<title>Rumblevale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one full-bleed game canvas; menus are DOM "screens" layered above it.
   Deliberately single-theme: a night-sky arcade cabinet look, dark on every host. */
:root {
  --ink: #140f29;
  --ink-2: #1d1640;
  --panel: #251c52;
  --panel-2: #33286e;
  --line: #4a3d93;
  --text: #fff4e2;
  --muted: #b9acdf;
  --gold: #ffc53d;
  --gold-deep: #d98a12;
  --hot: #ff4f73;
  --mint: #3ee6a8;
  --sky: #55c8ff;
  --violet: #b77cff;
  --parch: #f1dfb3;
  --parch-ink: #4b3216;
  --r-common: #c9c3de;
  --r-rare: #55c8ff;
  --r-epic: #c07bff;
  --r-legend: #ffc53d;
  --f-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --f-body: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --f-pixel: "Silkscreen", "Courier New", monospace;
  --shadow-hard: 0 4px 0 #0a0717;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 16px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#stageWrap { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#game { position: absolute; display: block; image-rendering: auto; }

button { font-family: var(--f-body); color: var(--text); cursor: pointer; }
button:focus-visible, .node-focus:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- generic screen ---------- */
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top, 0px)) 16px max(12px, env(safe-area-inset-bottom, 0px));
  overflow: auto; z-index: 20;
}
.screen.dim { background: rgba(10, 7, 25, .72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.screen.solid { background: radial-gradient(1200px 600px at 50% -10%, #3a2a86 0%, var(--ink) 60%); }
.center-col { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(100%, 980px); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h-display { font-family: var(--f-display); letter-spacing: .02em; font-weight: 400; }
.eyebrow { font-family: var(--f-pixel); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.btn {
  font-family: var(--f-display); font-size: 18px; letter-spacing: .04em;
  border: 0; border-radius: 12px; padding: 12px 22px; min-height: 48px;
  background: var(--panel-2); color: var(--text);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.35), var(--shadow-hard);
  transition: transform .08s ease, filter .12s ease;
}
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: translateY(3px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.35), 0 1px 0 #0a0717; }
.btn.gold { background: linear-gradient(#ffd766, var(--gold) 55%, var(--gold-deep)); color: #2a1600; }
.btn.hot { background: linear-gradient(#ff7892, var(--hot)); color: #2b0010; }
.btn.mint { background: linear-gradient(#78f5c6, var(--mint)); color: #002a1a; }
.btn.small { font-size: 14px; padding: 8px 14px; min-height: 40px; border-radius: 10px; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.btn[disabled] { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }

/* ---------- title ---------- */
#scrTitle { justify-content: center; align-items: center; background: linear-gradient(180deg, rgba(20,15,41,.15), rgba(20,15,41,.55) 70%, rgba(20,15,41,.9)); }
.logo { text-align: center; line-height: .9; filter: drop-shadow(0 6px 0 #0a0717); }
.logo .l1 {
  display: block; font-family: var(--f-display); font-size: clamp(46px, 11vw, 112px);
  background: linear-gradient(#fff3b0 10%, var(--gold) 45%, #ff8a2b 80%); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 2px #3a1a00; transform: rotate(-3deg);
}
.logo .l2 { display: inline-block; margin-top: 6px; font-family: var(--f-pixel); font-size: clamp(11px, 2.4vw, 16px); letter-spacing: .3em; color: var(--sky); background: rgba(10,7,25,.7); padding: 6px 10px; border-radius: 6px; }
.press-start { font-family: var(--f-pixel); font-size: 14px; letter-spacing: .2em; color: var(--text); animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.title-menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(100%, 460px); }
.title-menu .btn:first-child { grid-column: 1 / -1; font-size: 24px; min-height: 60px; }
.title-menu.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.title-menu .btn.revealed { background: linear-gradient(#78f5c6, var(--mint)); color: #002a1a; animation: reveal .7s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes reveal { from { transform: scale(0) rotate(-12deg); opacity: 0; } }
@media (max-width: 420px) { .title-menu.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } .title-menu.three .btn:last-child { grid-column: 1 / -1; } }
/* the secret cloud: tap it five times */
#secretCloud { position: absolute; top: max(8px, env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: 120px; height: 90px; padding: 0; border: 0; background: none; z-index: 3; touch-action: manipulation; }
#secretCloud canvas { width: 120px; height: 90px; display: block; }
#cloudSay { position: absolute; right: 100%; top: 18px; margin-right: 4px; white-space: nowrap; font-family: var(--f-body); font-weight: 600; font-size: 14px; color: #2a1f5c; background: #fff4e2; border: 2px solid #1b1030; border-radius: 12px; padding: 4px 10px; animation: cardIn .3s cubic-bezier(.2, 1.4, .4, 1) both; }
.title-foot { font-family: var(--f-pixel); font-size: 10px; color: var(--muted); letter-spacing: .08em; text-align: center; }

/* ---------- top bar (map etc.) ---------- */
.topbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.topbar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(10,7,25,.75); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 6px; font-family: var(--f-pixel); font-size: 14px; font-variant-numeric: tabular-nums; }
.coin { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6bf, var(--gold) 45%, var(--gold-deep)); box-shadow: inset 0 0 0 2px #a86400; }
.star-i { width: 18px; height: 18px; background: var(--gold); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }

/* ---------- world map ---------- */
#scrMap { padding: 0; }
#mapCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#mapTop { position: absolute; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top, 0px)) 12px 10px; background: linear-gradient(rgba(20,15,41,.85), rgba(20,15,41,0)); z-index: 2; }
#mapPanel {
  position: absolute; right: 12px; bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100% - 24px));
  background: linear-gradient(#2a2060, #1b1542); border: 3px solid var(--line); border-radius: 16px; padding: 14px; z-index: 3;
  box-shadow: 0 10px 0 rgba(0,0,0,.35);
}
#mapPanel h2 { font-family: var(--f-display); font-size: 22px; font-weight: 400; }
#mapPanel p { margin: 6px 0 10px; color: var(--muted); line-height: 1.35; font-size: 15px; }
.skulls { display: flex; gap: 3px; align-items: center; }
.skull { width: 14px; height: 14px; border-radius: 50% 50% 40% 40%; background: #5b4f86; }
.skull.on { background: var(--hot); }
.meta-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--f-pixel); font-size: 12px; color: var(--muted); }

/* ---------- hero select ---------- */
.hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; width: 100%; }
.hero-card {
  position: relative; background: linear-gradient(#2d2366, #1c1545); border: 3px solid var(--line); border-radius: 16px; padding: 8px 10px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0;
}
.hero-card canvas { width: 120px; height: 130px; }
.hero-card h3 { font-family: var(--f-display); font-weight: 400; font-size: 18px; }
.hero-card .role { font-size: 13px; color: var(--muted); }
.hero-card.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,197,61,.3), 0 8px 0 rgba(0,0,0,.3); }
.hero-card.locked { filter: grayscale(1) brightness(.6); }
.hero-card .lock { font-family: var(--f-pixel); font-size: 10px; color: var(--gold); margin-top: 4px; }
.statbars { width: 100%; display: grid; gap: 3px; margin-top: 4px; }
.statbar { display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: center; font-family: var(--f-pixel); font-size: 9px; color: var(--muted); text-align: left; }
.statbar i { display: block; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--mint), var(--sky)); }
.statbar span { display: block; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }

/* ---------- panels / lists ---------- */
.panel { background: linear-gradient(#2a2060, #1b1542); border: 3px solid var(--line); border-radius: 16px; padding: 16px; width: 100%; }
.screen-head { display: flex; align-items: center; gap: 10px; width: 100%; flex-wrap: wrap; }
.screen-head h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 5vw, 34px); flex: 1; min-width: 0; }

/* ---------- skill tree ---------- */
.tree { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%; }
.branch { display: flex; flex-direction: column; gap: 10px; align-items: stretch; background: rgba(10,7,25,.45); border-radius: 16px; padding: 12px 10px; border: 2px solid var(--line); min-width: 0; }
.branch h3 { font-family: var(--f-display); font-weight: 400; font-size: 17px; text-align: center; }
.branch .blurb { text-align: center; font-size: 12px; color: var(--muted); margin-top: -6px; }
.snode {
  position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 8px; align-items: center; text-align: left;
  background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 8px; min-height: 58px;
}
.snode::before { content: ""; position: absolute; left: 50%; top: -12px; width: 3px; height: 10px; background: var(--line); }
.snode:first-of-type::before { display: none; }
.snode canvas { width: 40px; height: 40px; }
.snode .nm { font-weight: 600; font-size: 14px; line-height: 1.1; }
.snode .ds { font-size: 12px; color: var(--muted); line-height: 1.2; margin-top: 2px; }
.snode .rk { font-family: var(--f-pixel); font-size: 10px; color: var(--gold); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
.snode.maxed { border-color: var(--gold); background: linear-gradient(#3b2d10, #2a2008); }
.snode.locked { opacity: .45; }
.snode.can { border-color: var(--mint); }
.snode:not(.locked):hover { filter: brightness(1.15); }
@media (max-width: 760px) { .tree { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- draft cards ---------- */
#scrDraft { justify-content: center; align-items: center; }
.draft-title { font-family: var(--f-display); font-size: clamp(28px, 6vw, 52px); color: var(--gold); text-shadow: 0 4px 0 #6a3a00; text-align: center; }
.cards { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 220px)); gap: 14px; justify-content: center; width: 100%; }
.card {
  --rc: var(--r-common);
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0;
  background: linear-gradient(170deg, #332a74, #1b1545 70%); border: 3px solid var(--rc); border-radius: 18px; padding: 14px 12px 16px;
  box-shadow: 0 0 0 3px rgba(0,0,0,.35), 0 10px 0 rgba(0,0,0,.35), 0 0 30px -6px var(--rc);
  animation: cardIn .45s cubic-bezier(.2, 1.4, .4, 1) both; transition: transform .12s ease;
}
.card:hover, .card:focus-visible { transform: translateY(-6px) rotate(-1deg); }
.card.rare { --rc: var(--r-rare); } .card.epic { --rc: var(--r-epic); } .card.legendary { --rc: var(--r-legend); }
.card.legendary::after { content: ""; position: absolute; inset: 0; border-radius: 15px; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 45%, transparent 60%); background-size: 250% 100%; animation: shine 2.2s linear infinite; pointer-events: none; }
@keyframes shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
@keyframes cardIn { from { transform: translateY(40px) scale(.8); opacity: 0; } }
.card canvas { width: 72px; height: 72px; }
.card .rar { font-family: var(--f-pixel); font-size: 10px; letter-spacing: .12em; color: var(--rc); text-transform: uppercase; }
.card .nm { font-family: var(--f-display); font-size: 18px; line-height: 1.05; }
.card .lv { font-family: var(--f-pixel); font-size: 11px; color: var(--gold); }
.card .ds { font-size: 14px; line-height: 1.3; color: #e2d9ff; }
.card .tag { font-family: var(--f-pixel); font-size: 9px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,.1); }
.card .key { position: absolute; top: 8px; left: 10px; font-family: var(--f-pixel); font-size: 10px; color: var(--muted); }
@media (max-width: 700px) {
  .cards { grid-template-columns: 1fr; max-width: 420px; gap: 8px; }
  .card { flex-direction: row; text-align: left; padding: 8px 10px; gap: 10px; animation-name: cardInSide; }
  .card canvas { width: 52px; height: 52px; flex: none; }
  .card .ds { font-size: 13px; }
  .card .key { display: none; }
  .card .txt { min-width: 0; }
  @keyframes cardInSide { from { transform: translateX(-30px); opacity: 0; } }
}
@media (max-height: 460px) and (orientation: landscape) {
  .card canvas { width: 48px; height: 48px; }
  .card .ds { font-size: 12px; }
  .card { padding: 8px; }
  .draft-title { font-size: 26px; }
}

/* ---------- results ---------- */
.big-stars { display: flex; gap: 10px; justify-content: center; }
.big-stars .s { width: 56px; height: 56px; background: #3b3170; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.big-stars .s.on { background: var(--gold); animation: starPop .5s cubic-bezier(.2, 1.8, .4, 1) both; }
.big-stars .s:nth-child(2) { animation-delay: .25s; } .big-stars .s:nth-child(3) { animation-delay: .5s; }
@keyframes starPop { from { transform: scale(0) rotate(-60deg); } }
.stat-table { display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; font-size: 15px; width: min(100%, 360px); }
.stat-table span:nth-child(even) { font-family: var(--f-pixel); text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }

/* ---------- lists ---------- */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; width: 100%; }
.ach { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; background: var(--panel); border-radius: 12px; padding: 10px; border: 2px solid var(--line); min-width: 0; }
.ach.got { border-color: var(--gold); }
.ach .medal { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); background: #3b3170; color: #7a6db0; }
.ach.got .medal { background: radial-gradient(circle at 35% 30%, #fff1a8, var(--gold) 50%, var(--gold-deep)); color: #4a2800; }
.ach .nm { font-weight: 600; }
.ach .ds { font-size: 13px; color: var(--muted); }

/* ---------- settings ---------- */
.set-list { display: grid; gap: 10px; width: min(100%, 560px); }
.set-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: var(--panel); border-radius: 12px; padding: 10px 14px; flex-wrap: wrap; }
.set-row label { font-weight: 500; }
.set-row input[type=range] { width: 160px; accent-color: var(--gold); }
.set-row input[type=text], textarea {
  font-family: var(--f-pixel); font-size: 14px; background: #120d26; color: var(--text); border: 2px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; flex: 1;
  -webkit-user-select: text; user-select: text;
}
textarea { width: 100%; resize: vertical; min-height: 70px; font-size: 12px; box-sizing: border-box; }
.toggle { appearance: none; -webkit-appearance: none; width: 52px; height: 30px; border-radius: 15px; background: #3b3170; position: relative; cursor: pointer; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle:checked { background: var(--mint); }
.toggle:checked::after { transform: translateX(22px); }

/* ---------- touch controls ---------- */
#touch { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#touch .zone-l { position: absolute; left: 0; bottom: 0; width: 45%; height: 70%; pointer-events: auto; }
#stick { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; background: rgba(255,255,255,.08); border: 3px solid rgba(255,255,255,.25); pointer-events: none; }
#stickKnob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #c9c3de); box-shadow: 0 3px 0 rgba(0,0,0,.4); }
#stickGhost { position: absolute; left: max(28px, env(safe-area-inset-left, 0px)); bottom: max(34px, env(safe-area-inset-bottom, 0px)); width: 124px; height: 124px; border-radius: 50%; border: 3px dashed rgba(255,255,255,.22); display: grid; place-items: center; pointer-events: none; transition: opacity .2s; }
#stickGhost span { font-family: var(--f-pixel); font-size: 11px; letter-spacing: .15em; color: rgba(255,255,255,.35); }
#stickGhost.off { opacity: 0; }
.console-deco { display: none; }
body.portrait #touch { background: linear-gradient(180deg, #2c2366 0, #221a52 40%, #1b1542); border-top: 4px solid #3b2f7d; border-radius: 0 0 26px 26px; }
body.portrait .console-deco { display: flex; position: absolute; left: 16px; right: 16px; top: 12px; align-items: center; gap: 10px; pointer-events: none; }
body.portrait .console-deco .led { width: 10px; height: 10px; border-radius: 50%; background: #ff4f73; box-shadow: 0 0 10px #ff4f73; animation: blink 2.4s steps(2) infinite; }
body.portrait .console-deco .brand { font-family: var(--f-display); font-size: 13px; letter-spacing: .08em; color: #8f84c8; }
body.portrait .console-deco .brand i { font-family: var(--f-pixel); font-style: normal; font-size: 10px; color: var(--gold); }
body.portrait .console-deco .grille { margin-left: auto; width: 60px; height: 26px; background: repeating-linear-gradient(115deg, transparent 0 6px, rgba(0,0,0,.35) 6px 10px); border-radius: 6px; }
#touch .pad-r { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); width: 230px; height: 210px; pointer-events: none; }
.tbtn {
  position: absolute; pointer-events: auto; border-radius: 50%; border: 3px solid rgba(255,255,255,.35);
  background: rgba(30,22,70,.55); color: #fff; font-family: var(--f-display); font-size: 20px;
  display: grid; place-items: center; touch-action: none; padding: 0;
}
.tbtn.on { background: rgba(255,255,255,.35); transform: scale(.94); }
.tbtn.a { width: 84px; height: 84px; right: 0; bottom: 18px; background: rgba(255,79,115,.55); font-size: 26px; }
.tbtn.j { width: 64px; height: 64px; right: 92px; bottom: 0; background: rgba(85,200,255,.5); }
.tbtn.d { width: 64px; height: 64px; right: 20px; bottom: 112px; background: rgba(62,230,168,.45); }
.tbtn.s { width: 54px; height: 54px; font-size: 13px; font-family: var(--f-pixel); overflow: hidden; }
.tbtn.s canvas { width: 100%; height: 100%; }
.tbtn.s .cd { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(10,7,25,.75) var(--cd, 0%), transparent 0); }
.tbtn.s1 { right: 100px; bottom: 80px; } .tbtn.s2 { right: 158px; bottom: 30px; } .tbtn.s3 { right: 92px; bottom: 142px; }
.tbtn.od { width: 50px; height: 50px; right: 160px; bottom: 100px; background: rgba(255,197,61,.35); font-size: 20px; }
.tbtn.od.ready { background: rgba(255,197,61,.85); animation: pulse .8s ease-in-out infinite alternate; }
@keyframes pulse { to { box-shadow: 0 0 22px 4px rgba(255,197,61,.9); } }
.tbtn.hide { display: none; }
body.portrait #touch { top: auto; }
body.portrait #touch .zone-l { width: 50%; height: 100%; }

#pauseBtn { position: absolute; z-index: 11; right: max(10px, env(safe-area-inset-right, 0px)); top: max(8px, env(safe-area-inset-top, 0px)); width: 44px; height: 44px; border-radius: 12px; border: 2px solid rgba(255,255,255,.3); background: rgba(10,7,25,.6); color: #fff; font-family: var(--f-display); font-size: 18px; }

/* ---------- toasts ---------- */

// ============================================================
//  Input: keyboard (+ LF2 style D→A sequences), touch stick & buttons,
//  cheat-code buffer, Konami code
// ============================================================
const Input = (() => {
  const held = {};           // logical buttons currently held
  const pressed = {};        // pressed this frame (edge)
  const keyMap = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    KeyJ: 'atk', KeyZ: 'atk', KeyK: 'jump', KeyX: 'jump', KeyL: 'def', KeyC: 'def',
    KeyU: 's1', KeyI: 's2', KeyO: 's3', Digit1: 's1', Digit2: 's2', Digit3: 's3', Space: 'od',
    Escape: 'pause', KeyP: 'pause', Enter: 'start',
  };
  let seqBuf = [];           // recent logical presses with time, for D→A combos
  let cheatBuf = '';
  let konami = [];
  const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];
  let lastTap = { left: 0, right: 0 };
  let runDir = 0;

  let usingTouch = false;
  const listeners = { cheat: [], konami: [], anyKey: [] };
  let typingHandler = null;  // Keyboard Warrior mode takes raw keys

  function now() { return performance.now(); }
  function press(b) {
    if (!held[b]) {
      pressed[b] = true;
      seqBuf.push({ b, t: now() });
      if (seqBuf.length > 8) seqBuf.shift();
      if (b === 'left' || b === 'right') {
        const t = now();
        if (t - lastTap[b] < 260) runDir = b === 'left' ? -1 : 1;
        lastTap[b] = t;
      }
    }
    held[b] = true;
  }
  function release(b) {
    held[b] = false;
    if ((b === 'left' && runDir < 0) || (b === 'right' && runDir > 0)) runDir = 0;
  }

    const t = e.target;
    return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') && t.id !== 'typeInput';
  }
  window.addEventListener('keydown', (e) => {
    Sfx.init();
    if (isTextTarget(e)) return;
    if (typingHandler && typingHandler(e)) { e.preventDefault(); return; }
    usingTouch = false;
    // konami
    konami.push(e.code); if (konami.length > KONAMI.length) konami.shift();

  // LF2 grammar: Defend, then a direction, then Attack inside a short window
  function consumeSpecial() {
    const n = seqBuf.length;

    else if (d.b === 'down') slot = 's3';

      stickEl.style.left = stick.ox + 'px'; stickEl.style.top = stick.oy + 'px';

  function moveVec() {
    let x = 0, z = 0, run = false;

    if (held.right) x += 1;

    set touch(v) { usingTouch = v; },
    setTyping(fn) { typingHandler = fn; },
    resetCheat() { cheatBuf = ''; },
  };
})();

// ---------- glow sprite cache ----------
const glowCache = new Map();

  gr.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);

  ctx.globalAlpha = 1;

  draw(camX, camY) {

      const x = p.x - camX, y = p.y - camY;

    }
    case 'hurt': {
      const k = Math.min(1, t / 0.25);
      p.lean = -0.35 * (1 - k * 0.5); p.headTilt = -0.3; p.aF = -0.6; p.bF = 0.5; p.aB = -1.2; p.bB = 0.4;

    case 'air': { // knocked into the air, spinning back
      p.rot = -Math.min(1.4, t * 5); p.aF = -2.2; p.aB = -2.6; p.bF = 0.3; p.bB = 0.3; p.lF = 0.7; p.lB = 0.2; p.kF = 0.5; p.kB = 0.9;
      p.eyes = 'hurt'; p.mouth = 'o';

    case 'hold': {

      break;

    case 'win': {
      const b = Math.abs(Math.sin(T * 6));
      p.aF = 2.8; p.bF = 0.2; p.aB = 0.3; p.bob = -b * 10; p.eyes = 'happy'; p.mouth = 'grin';
      break;
    }
    case 'dash': {
      p.lean = 0.35; p.lF = 1.0; p.kF = 0.8; p.lB = -0.9; p.kB = 0.5; p.aF = 1.2; p.bF = 0.3; p.aB = -1.2; p.bB = 0.2; p.trail = 1;

}

// Attack poses: move.pose chooses the silhouette; k = normalized progress
function poseAttack(f, p) {
  const m = f.move; if (!m) return;
  const t = f.animT;
  const wu = m.windup, ac = m.active, rc = m.recover;
  let ph; // 0..1 windup, 1..2 active, 2..3 recovery
  if (t < wu) ph = t / wu;
  else if (t < wu + ac) ph = 1 + (t - wu) / ac;
  else ph = 2 + Math.min(1, (t - wu - ac) / rc);
  const w = Math.min(1, ph), s = clamp(ph - 1, 0, 1), r = clamp(ph - 2, 0, 1);
  const strike = ph >= 1 ? 1 - r * 0.7 : 0;
  p.eyes = 'angry'; p.mouth = ph >= 1 && ph < 2 ? 'yell' : 'grit';
  switch (m.pose) {
    case 'jab':
      p.aF = lerp(0.6, 0.2, w) + strike * 1.3; p.bF = lerp(1.6, 2.0, w) * (1 - strike) + 0.05;
      p.aB = 0.5; p.bB = 1.6; p.lean = -0.05 * w + 0.15 * strike; p.lF = 0.35; p.lB = -0.35; p.kF = 0.2; p.kB = 0.25;
      break;
    case 'cross':
      p.aB = lerp(0.5, 0.0, w) + strike * 1.5; p.bB = 1.6 * (1 - strike) + 0.05; p.aF = 0.6; p.bF = 1.8;
      p.lean = 0.25 * strike - 0.08 * w; p.lF = 0.5; p.lB = -0.45; p.kF = 0.3;
      break;
    case 'upper':
      p.aF = lerp(0.3, -0.3, w) + strike * 2.6; p.bF = 1.8 - strike * 1.5; p.aB = 0.4; p.bB = 1.5;
      p.lean = lerp(0.1, 0.3, w) - strike * 0.35; p.kF = 0.8 * w * (1 - strike); p.kB = 0.6 * w * (1 - strike); p.lF = 0.4; p.lB = -0.3;
      p.bob = -strike * 6; p.sy = 1 + strike * 0.06;
      break;
    case 'kick':
      p.lF = lerp(0.2, -0.2, w) + strike * 1.7; p.kF = lerp(0.3, 1.8, w) * (1 - strike); p.lB = -0.2; p.kB = 0.15;
      p.aF = -0.4; p.bF = 1.2; p.aB = 0.7; p.bB = 1.5; p.lean = -0.25 * strike;
      break;
    case 'flykick':
      p.lF = 1.6; p.kF = 0.05; p.lB = 0.4; p.kB = 1.6; p.aF = -0.6; p.aB = -1.2; p.bF = 0.8; p.bB = 0.4; p.lean = -0.2;
      break;
    case 'swing': // overhead weapon swing (staff, axe)
      p.aF = lerp(0.6, 2.8, w) - strike * 2.2 - r * 0.2; p.bF = 0.25; p.aB = lerp(0.3, 2.4, w) - strike * 2.0; p.bB = 0.35;
      p.lean = -0.15 * w + 0.28 * strike; p.lF = 0.5; p.lB = -0.45; p.kF = 0.35 * strike;
      p.wpnA = strike;
      break;
    case 'slam': // hammer smash
      p.aF = lerp(0.4, 3.0, w) - strike * 2.7; p.bF = 0.15; p.aB = lerp(0.3, 2.9, w) - strike * 2.6; p.bB = 0.2;
      p.lean = -0.25 * w + 0.45 * strike; p.kF = 0.6 * strike; p.kB = 0.6 * strike; p.lF = 0.55; p.lB = -0.5;
      p.bob = strike * 5; p.sy = 1 - strike * 0.08; p.sx = 1 + strike * 0.08;
      break;
    case 'thrust': // dagger stab / staff poke
      p.aF = lerp(0.9, 0.7, w) + strike * 0.95; p.bF = lerp(1.9, 2.2, w) * (1 - strike) + 0.02; p.aB = 1.2 + strike * 0.3; p.bB = 1.3;
      p.lean = 0.3 * strike; p.lF = 0.7 * strike + 0.2; p.lB = -0.6; p.kF = 0.5 * strike;
      break;
    case 'spin':
      p.rot = 0; p.aF = 1.6; p.aB = 1.6 + Math.PI; p.bF = 0.1; p.bB = 0.1; p.lean = 0; p.lF = 0.3; p.lB = -0.3;
      p.spin = ph * Math.PI * 2;
      break;
    case 'bite': case 'lunge':
      p.lean = 0.4 * strike - 0.2 * w; p.aF = 1.4 * strike + 0.3; p.aB = 1.2 * strike; p.bF = 0.3; p.bB = 0.3; p.lF = 0.8 * strike; p.lB = -0.7 * strike;
      break;
    case 'cast': case 'shoot':
      p.aF = lerp(0.3, 1.6, w); p.bF = 0.1; p.aB = lerp(0.1, 1.2, w); p.bB = 0.3; p.lean = -0.06; p.eyes = 'focus'; p.mouth = 'o';
      p.glow = f.castColor || '#fff';
      break;
    case 'throwP':
      p.aF = lerp(1.5, 3.0, w) - strike * 2.2; p.bF = 0.3; p.aB = 0.8; p.bB = 1.0; p.lean = -0.2 * w + 0.3 * strike;
      break;
    case 'stomp':
      p.lF = lerp(0.2, 1.3, w) - strike * 1.2; p.kF = lerp(0.2, 1.6, w) * (1 - strike); p.aF = 1.9 * w * (1 - strike) + 0.4; p.aB = 1.7 * w * (1 - strike) + 0.2; p.bF = 0.5; p.bB = 0.5;
      p.bob = strike * 4; p.sy = 1 - strike * 0.1; p.sx = 1 + strike * 0.1;
      break;
  }
}

// ---------------- humanoid ----------------
// look = {build:{s, head, torso, width, limb, leg, arm}, skin, hair, hairStyle, top, top2, pants, shoes, accent, weapon, face, extras}
function drawHumanoid(g, x, y, sc, face, look, pose, fx) {
  const B = look.build;
  const s = sc * B.s;
  const white = fx && fx.flash;
  const tint = fx && fx.tint;
  const col = (c) => (white ? '#ffffff' : tint ? mix(c, tint, 0.55) : c);
  const LW = 3.2;
  g.save();
  g.translate(x, y + pose.bob * s);
  g.scale(face * s, s);
  if (pose.rot) { g.translate(0, -18); g.rotate(pose.rot); g.translate(0, 18); }
  g.scale(pose.sx, pose.sy);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const legLen = B.leg, hipY = -legLen * 2 + 2;
  const torsoH = B.torso, torsoW = B.width;
  // torso pivot at hip
  const lean = pose.lean;
  const shX = Math.sin(lean) * torsoH, shY = hipY - Math.cos(lean) * torsoH;
  const limb = B.limb;

  const drawLimb = (ax, ay, a1, b, len1, len2, color, w, knee) => {
    const ex = ax + Math.sin(a1) * len1, ey = ay + Math.cos(a1) * len1;
    const a2 = knee ? a1 - b : a1 + b;
    const hx = ex + Math.sin(a2) * len2, hy = ey + Math.cos(a2) * len2;
    g.strokeStyle = OUTLINE; g.lineWidth = w + LW * 2;
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(ex, ey); g.lineTo(hx, hy); g.stroke();
    g.strokeStyle = color; g.lineWidth = w;
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(ex, ey); g.lineTo(hx, hy); g.stroke();
    return { ex, ey, hx, hy, a2 };
  };
  const drawFoot = (lx, ly, a, color) => {
    g.save(); g.translate(lx, ly); g.rotate(-a * 0.3);
    g.fillStyle = color; g.strokeStyle = OUTLINE; g.lineWidth = LW;
    g.beginPath(); g.ellipse(3, 1, limb * 0.85, limb * 0.5, 0, 0, TAU); g.fill(); g.stroke();
    g.restore();
  };
  const drawHand = (hx, hy, color, big) => {
    g.fillStyle = color; g.strokeStyle = OUTLINE; g.lineWidth = LW;
    g.beginPath(); g.arc(hx, hy, big ? limb * 0.95 : limb * 0.62, 0, TAU); g.fill(); g.stroke();
  };
  const skin = col(look.skin);
  const back = (c) => col(shade(c, -0.28));

  // --- back leg & arm
  const hipBx = -torsoW * 0.18;
  const lb = drawLimb(hipBx, hipY, pose.lB, pose.kB, legLen, legLen, back(look.pants), limb * 1.05, true);
  drawFoot(lb.hx, lb.hy, pose.lB, back(look.shoes));
  if (look.cape) drawCape(g, shX, shY, pose, col(look.cape), torsoH);
  const abx = shX - torsoW * 0.25, aby = shY + 4;
  const ab = drawLimb(abx, aby, pose.aB, pose.bB, B.arm, B.arm - 1, back(look.sleeve || look.top), limb * 0.9, false);
  if (look.weapon === 'daggers') drawWeapon(g, 'dagger', ab.hx, ab.hy, ab.a2, look, pose, col, true);
  drawHand(ab.hx, ab.hy, look.gloves ? back(look.gloves) : back(look.skin), look.weapon === 'gauntlets');

  // --- torso (rounded trapezoid following lean)
  g.save();
  g.translate(0, hipY); g.rotate(lean);
  const tw = torsoW, th = torsoH;
  g.fillStyle = col(look.top); g.strokeStyle = OUTLINE; g.lineWidth = LW;
  g.beginPath();
  g.moveTo(-tw * 0.42, 2); g.lineTo(tw * 0.42, 2);
  g.quadraticCurveTo(tw * 0.62, -th * 0.55, tw * 0.5, -th);
  g.lineTo(-tw * 0.5, -th);
  g.quadraticCurveTo(-tw * 0.62, -th * 0.55, -tw * 0.42, 2);
  g.closePath(); g.fill();
  // cel shade back half
  g.save(); g.clip();
  g.fillStyle = col(shade(look.top, -0.25)); g.fillRect(-tw, -th - 2, tw * 0.75, th + 6);
  if (look.top2) { g.fillStyle = col(look.top2); g.fillRect(-tw * 0.12, -th, tw * 0.3, th + 2); }
  if (look.belt) { g.fillStyle = col(look.belt); g.fillRect(-tw, -5, tw * 2, 6); }
  if (look.chest) look.chest(g, tw, th, col);
  g.restore();
  g.stroke();
  g.restore();

  // --- front leg
  const lf = drawLimb(torsoW * 0.18, hipY, pose.lF, pose.kF, legLen, legLen, col(look.pants), limb * 1.05, true);
  drawFoot(lf.hx, lf.hy, pose.lF, col(look.shoes));

  // --- head
  const hr = B.head * (BIGHEAD ? 1.7 : 1);
  const hx = shX + Math.sin(lean) * (hr * 0.7), hy = shY - hr * 0.78 + pose.headY;
  g.save();
  g.translate(hx, hy); g.rotate(pose.headTilt + lean * 0.3);
  drawHead(g, hr, look, pose, col, fx);
  g.restore();

  // --- front arm (with weapon)
  const afx = shX + torsoW * 0.22, afy = shY + 4;
  if (pose.spin) { g.save(); g.translate(afx, afy); g.rotate(pose.spin); g.translate(-afx, -afy); }
  const af = drawLimb(afx, afy, pose.aF, pose.bF, B.arm, B.arm - 1, col(look.sleeve || look.top), limb * 0.9, false);
  if (look.weapon && look.weapon !== 'gauntlets' && look.weapon !== 'none') drawWeapon(g, look.weapon, af.hx, af.hy, af.a2, look, pose, col, false);
  drawHand(af.hx, af.hy, look.gloves ? col(look.gloves) : skin, look.weapon === 'gauntlets');
  if (look.weapon === 'gauntlets' && look.wpnGlow) {
    g.globalCompositeOperation = 'lighter';
    drawGlowLocal(g, af.hx, af.hy, 14, look.wpnGlow);
    g.globalCompositeOperation = 'source-over';
  }
  if (pose.spin) g.restore();
  if (pose.glow) {
    g.globalCompositeOperation = 'lighter';
    drawGlowLocal(g, af.hx, af.hy, 22, pose.glow);
    g.globalCompositeOperation = 'source-over';
  }
  g.restore();
  return { handX: x + face * (af.hx) * s, handY: y + af.hy * s, headY: y + (hy - hr) * s };
}
function drawGlowLocal(g, x, y, r, color) {
  const s = glowSprite(color, 32);
  g.drawImage(s, x - r, y - r, r * 2, r * 2);
}
function drawCape(g, shX, shY, pose, color, th) {
  g.fillStyle = color; g.strokeStyle = OUTLINE; g.lineWidth = 3;
  const flow = pose.trail ? 12 : 4;
  g.beginPath();
  g.moveTo(shX - 6, shY);
  g.quadraticCurveTo(shX - 20 - flow, shY + th * 0.6, shX - 14 - flow * 1.4, shY + th + 8);
  g.lineTo(shX - 2, shY + th + 2);
  g.closePath(); g.fill(); g.stroke();
}

function drawEyes(g, hr, pose, look) {
  const ex1 = hr * 0.18, ex2 = hr * 0.62, ey = hr * 0.05;
  const er = hr * 0.2;
  const e = pose.eyes;
  const blink = look._blink;
  g.lineWidth = 2.4; g.strokeStyle = OUTLINE;
  const pupil = look.eyeColor || '#1b1030';
  const drawOne = (ex, small) => {
    const rr = small ? er * 0.85 : er;
    if (e === 'ko') {
      g.beginPath(); g.moveTo(ex - rr * 0.7, ey - rr * 0.7); g.lineTo(ex + rr * 0.7, ey + rr * 0.7); g.moveTo(ex + rr * 0.7, ey - rr * 0.7); g.lineTo(ex - rr * 0.7, ey + rr * 0.7); g.stroke();
    } else if (e === 'hurt') {
      g.beginPath(); g.moveTo(ex - rr * 0.7, ey - rr * 0.6); g.lineTo(ex + rr * 0.3, ey); g.lineTo(ex - rr * 0.7, ey + rr * 0.6); g.stroke();
    } else if (e === 'happy') {
      g.beginPath(); g.arc(ex, ey + rr * 0.3, rr * 0.7, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
    } else if (e === 'dizzy') {
      g.beginPath(); for (let a = 0; a < TAU * 1.5; a += 0.4) { const r2 = rr * a / (TAU * 1.5); g.lineTo(ex + Math.cos(a) * r2, ey + Math.sin(a) * r2); } g.stroke();
    } else if (blink) {
      g.beginPath(); g.moveTo(ex - rr * 0.7, ey); g.lineTo(ex + rr * 0.7, ey); g.stroke();
    } else {
      g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(ex, ey, rr * 0.8, rr * 1.05, 0, 0, TAU); g.fill(); g.stroke();
      g.fillStyle = pupil;
      g.beginPath(); g.ellipse(ex + rr * 0.25, ey + rr * 0.1, rr * 0.45, rr * 0.62, 0, 0, TAU); g.fill();
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(ex + rr * 0.1, ey - rr * 0.25, rr * 0.18, 0, TAU); g.fill();
    }
  };
  drawOne(ex1, true); drawOne(ex2, false);
  // brows
  if (e === 'angry' || e === 'focus' || look.angry) {
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(ex1 - er * 0.8, ey - er * 1.5); g.lineTo(ex1 + er * 0.7, ey - er * 1.05);
    g.moveTo(ex2 - er * 0.8, ey - er * 1.05); g.lineTo(ex2 + er * 0.8, ey - er * 1.6); g.stroke();
  }
}
function drawMouth(g, hr, pose) {
  const mx = hr * 0.45, my = hr * 0.5;
  g.strokeStyle = OUTLINE; g.lineWidth = 2.4; g.fillStyle = '#5a1030';
  switch (pose.mouth) {
    case 'o': g.beginPath(); g.ellipse(mx, my, hr * 0.1, hr * 0.13, 0, 0, TAU); g.fill(); g.stroke(); break;
    case 'yell': g.beginPath(); g.moveTo(mx - hr * 0.18, my - hr * 0.05); g.lineTo(mx + hr * 0.2, my - hr * 0.08); g.lineTo(mx + hr * 0.05, my + hr * 0.18); g.closePath(); g.fill(); g.stroke(); break;
    case 'grit': g.beginPath(); g.moveTo(mx - hr * 0.15, my); g.lineTo(mx + hr * 0.18, my - hr * 0.03); g.stroke(); break;
    case 'grin': g.beginPath(); g.arc(mx, my - hr * 0.05, hr * 0.18, 0.2, Math.PI - 0.2); g.fill(); g.stroke(); break;

  }
}

function drawHead(g, hr, look, pose, col, fx) {
  g.strokeStyle = OUTLINE; g.lineWidth = 3.2;
  const hs = look.hairStyle;
  const hair = col(look.hair || '#333');
  // things behind the head
  if (hs === 'long' || hs === 'hood' || hs === 'ponytail') {
    g.fillStyle = hs === 'hood' ? col(look.hood) : hair;
    g.beginPath(); g.ellipse(-hr * 0.35, hr * 0.35, hr * 0.75, hr * 1.0, 0.3, 0, TAU); g.fill(); g.stroke();
    if (hs === 'ponytail') { g.beginPath(); g.ellipse(-hr * 1.1, hr * 0.1, hr * 0.45, hr * 0.28, -0.6 + Math.sin((look._t || 0) * 5) * 0.2, 0, TAU); g.fill(); g.stroke(); }
  }
  if (hs === 'scarf' || look.scarf) {
    g.fillStyle = col(look.scarf || look.accent);
    const w = Math.sin((look._t || 0) * 9) * 3;
    g.beginPath(); g.moveTo(-hr * 0.3, hr * 0.8); g.quadraticCurveTo(-hr * 1.3, hr * 0.7 + w, -hr * 1.9, hr * 0.4 - w); g.lineTo(-hr * 1.8, hr * 0.9 + w); g.quadraticCurveTo(-hr * 1.2, hr * 1.1, -hr * 0.2, hr * 1.05); g.closePath(); g.fill(); g.stroke();
  }

  g.fillStyle = skinC;
  if (look.headShape === 'skull') {
    g.fillStyle = col('#f2ecdc');
    g.beginPath(); g.arc(0, 0, hr, 0, TAU); g.fill(); g.stroke();
    g.beginPath(); g.fillStyle = col('#e1d8c2'); g.fillRect(hr * 0.05, hr * 0.55, hr * 0.7, hr * 0.4); g.strokeRect(hr * 0.05, hr * 0.55, hr * 0.7, hr * 0.4);

    g.fillStyle = look.eyeGlow || '#ff4f73'; g.beginPath(); g.arc(hr * 0.22, hr * 0.04, hr * 0.07, 0, TAU); g.arc(hr * 0.64, hr * 0.04, hr * 0.07, 0, TAU); g.fill();
    for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(hr * (0.2 + i * 0.2), hr * 0.55); g.lineTo(hr * (0.2 + i * 0.2), hr * 0.95); g.stroke(); }
  } else {

    // shade

    g.restore();
    // ear
    if (look.ears === 'goblin') {
      g.fillStyle = skinC; g.beginPath(); g.moveTo(-hr * 0.2, -hr * 0.1); g.lineTo(-hr * 1.5, -hr * 0.6); g.lineTo(-hr * 0.3, hr * 0.35); g.closePath(); g.fill(); g.stroke();
    } else if (look.ears === 'cow') {

    } else if (hs !== 'hood' && hs !== 'helmet' && hs !== 'mummy') {

    }

    }
    drawEyes(g, hr, pose, look);
    if (!look.snout && !look.beard) drawMouth(g, hr, pose);
    // blush
    if (look.blush) { g.fillStyle = 'rgba(255,110,140,.35)'; g.beginPath(); g.ellipse(hr * 0.72, hr * 0.32, hr * 0.14, hr * 0.08, 0, 0, TAU); g.fill(); }
  }
  // hair / headgear on top
  g.fillStyle = hair; g.strokeStyle = OUTLINE; g.lineWidth = 3.2;
  switch (hs) {
    case 'spiky': {
      g.beginPath();
      g.moveTo(-hr * 1.05, hr * 0.2);
      const spikes = [[-1.3, -0.5], [-0.75, -0.55], [-0.95, -1.25], [-0.3, -0.8], [-0.2, -1.55], [0.25, -0.85], [0.6, -1.35], [0.7, -0.62], [1.2, -0.75], [0.95, -0.2]];
      for (const [a, b] of spikes) g.lineTo(hr * a, hr * b);
      g.quadraticCurveTo(hr * 0.5, -hr * 0.45, hr * 0.1, -hr * 0.3);
      g.quadraticCurveTo(-hr * 0.2, -hr * 0.1, -hr * 0.3, hr * 0.35);
      g.closePath(); g.fill(); g.stroke();
      if (look.headband) { g.fillStyle = col(look.headband); g.beginPath(); g.moveTo(-hr * 1.0, -hr * 0.1); g.quadraticCurveTo(0, -hr * 0.55, hr * 1.0, -hr * 0.35); g.lineTo(hr * 0.98, -hr * 0.12); g.quadraticCurveTo(0, -hr * 0.32, -hr * 1.0, hr * 0.12); g.closePath(); g.fill(); g.stroke();
        const w = Math.sin((look._t || 0) * 10) * 3; g.beginPath(); g.moveTo(-hr * 0.95, 0); g.lineTo(-hr * 1.7, hr * 0.1 + w); g.lineTo(-hr * 1.6, hr * 0.35 - w); g.closePath(); g.fill(); g.stroke(); }
      break;
    }
    case 'bob': case 'long': case 'ponytail': {
      g.beginPath(); g.arc(0, -hr * 0.05, hr * 1.06, Math.PI * 0.95, Math.PI * 2.05); g.quadraticCurveTo(hr * 0.5, -hr * 0.25, hr * 0.1, -hr * 0.4); g.quadraticCurveTo(-hr * 0.3, -hr * 0.1, -hr * 0.4, hr * 0.5); g.lineTo(-hr * 1.05, hr * 0.5); g.closePath(); g.fill(); g.stroke();
      break;
    }
    case 'hood': {
      g.fillStyle = col(look.hood);
      g.beginPath(); g.moveTo(-hr * 1.15, hr * 0.8); g.quadraticCurveTo(-hr * 1.35, -hr * 0.9, -hr * 0.2, -hr * 1.25);
      g.lineTo(hr * 0.3, -hr * 1.9); g.quadraticCurveTo(hr * 1.2, -hr * 0.9, hr * 1.12, -hr * 0.1);
      g.quadraticCurveTo(hr * 0.5, -hr * 0.62, hr * 0.0, -hr * 0.48); g.quadraticCurveTo(-hr * 0.45, -hr * 0.2, -hr * 0.45, hr * 0.8); g.closePath(); g.fill(); g.stroke();
      if (look.hoodTrim) { g.strokeStyle = col(look.hoodTrim); g.lineWidth = 3; g.beginPath(); g.moveTo(hr * 1.05, -hr * 0.15); g.quadraticCurveTo(hr * 0.5, -hr * 0.6, hr * 0.0, -hr * 0.46); g.quadraticCurveTo(-hr * 0.42, -hr * 0.2, -hr * 0.42, hr * 0.75); g.stroke(); }
      if (look.bangs) { g.fillStyle = hair; g.beginPath(); g.moveTo(hr * 0.05, -hr * 0.45); g.quadraticCurveTo(hr * 0.6, -hr * 0.55, hr * 0.95, -hr * 0.12); g.quadraticCurveTo(hr * 0.5, -hr * 0.3, hr * 0.35, -hr * 0.05); g.quadraticCurveTo(hr * 0.2, -hr * 0.3, hr * 0.05, -hr * 0.45); g.fill(); g.strokeStyle = OUTLINE; g.lineWidth = 2.5; g.stroke(); }
      break;
    }
    case 'bald': case 'beard': {
      g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(hr * 0.1, -hr * 0.6, hr * 0.35, hr * 0.15, -0.3, 0, TAU); g.fill();
      break;
    }
    case 'mohawk': {
      g.beginPath(); g.moveTo(-hr * 0.8, -hr * 0.5);
      for (let i = 0; i < 5; i++) { const a = -2.5 + i * 0.28; g.lineTo(Math.cos(a) * hr * 1.7, Math.sin(a) * hr * 1.7 - hr * 0.1); g.lineTo(Math.cos(a + 0.14) * hr * 0.92, Math.sin(a + 0.14) * hr * 0.92); }
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = col(shade(look.skin, -0.12)); g.beginPath(); g.arc(-hr * 0.1, -hr * 0.05, hr * 0.85, Math.PI * 1.1, Math.PI * 1.35); g.fill();
      break;
    }
    case 'ninja': {
      g.fillStyle = col(look.hood);
      g.beginPath(); g.arc(0, 0, hr * 1.04, Math.PI * 0.62, Math.PI * 2.1); g.lineTo(hr * 0.95, -hr * 0.2); g.lineTo(hr * 0.05, -hr * 0.3); g.lineTo(-hr * 0.1, hr * 0.62); g.closePath(); g.fill(); g.stroke();
      // fox half-mask over the lower face
      if (look.foxMask) {
        g.fillStyle = col('#fff4e8'); g.beginPath(); g.moveTo(hr * 0.02, hr * 0.28); g.quadraticCurveTo(hr * 0.9, hr * 0.12, hr * 1.35, hr * 0.5); g.quadraticCurveTo(hr * 0.8, hr * 1.0, hr * 0.1, hr * 0.92); g.closePath(); g.fill(); g.stroke();
        g.strokeStyle = col('#ff4f73'); g.lineWidth = 2; g.beginPath(); g.moveTo(hr * 0.4, hr * 0.55); g.lineTo(hr * 0.9, hr * 0.5); g.stroke();
        g.fillStyle = col(look.hood); g.beginPath(); g.moveTo(-hr * 0.3, -hr * 0.75); g.lineTo(-hr * 0.2, -hr * 1.6); g.lineTo(hr * 0.35, -hr * 0.95); g.closePath(); g.fill(); g.strokeStyle = OUTLINE; g.lineWidth = 3; g.stroke();
        g.fillStyle = col('#ff9fb8'); g.beginPath(); g.moveTo(-hr * 0.18, -hr * 0.9); g.lineTo(-hr * 0.15, -hr * 1.3); g.lineTo(hr * 0.15, -hr * 0.98); g.closePath(); g.fill();
      }
      break;
    }
    case 'bandana': {
      g.fillStyle = col(look.bandana || '#d8343f');
      g.beginPath(); g.arc(0, -hr * 0.05, hr * 1.04, Math.PI * 1.02, Math.PI * 1.98); g.quadraticCurveTo(0, -hr * 0.55, -hr * 1.02, -hr * 0.1); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(-hr * 0.95, -hr * 0.3); g.lineTo(-hr * 1.5, -hr * 0.1); g.lineTo(-hr * 1.3, hr * 0.25); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(hr * 0.1, -hr * 0.62, hr * 0.07, 0, TAU); g.arc(-hr * 0.35, -hr * 0.55, hr * 0.06, 0, TAU); g.fill();
      break;
    }
    case 'helmet': {
      g.fillStyle = col(look.helmet || '#aab4c8');
      g.beginPath(); g.arc(0, 0, hr * 1.08, Math.PI * 0.75, Math.PI * 2.25); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = col('#1b1030'); g.fillRect(hr * 0.05, -hr * 0.15, hr * 1.0, hr * 0.28);
      g.fillStyle = look.eyeGlow || '#ffe45c'; g.fillRect(hr * 0.35, -hr * 0.07, hr * 0.5, hr * 0.1);
      if (look.plume) { g.fillStyle = col(look.plume); g.beginPath(); g.moveTo(-hr * 0.2, -hr * 1.0); g.quadraticCurveTo(-hr * 1.5, -hr * 1.6, -hr * 1.8, -hr * 0.4); g.quadraticCurveTo(-hr * 1.0, -hr * 1.0, -hr * 0.3, -hr * 0.8); g.fill(); g.stroke(); }
      if (look.horns) { g.fillStyle = col('#f2ecdc'); [[-0.5, -1], [0.5, -1]].forEach(([a]) => { g.beginPath(); g.moveTo(hr * a * 0.8, -hr * 0.85); g.quadraticCurveTo(hr * a * 2.2, -hr * 1.4, hr * a * 1.8, -hr * 2.0); g.quadraticCurveTo(hr * a * 1.5, -hr * 1.2, hr * a * 0.2, -hr * 0.95); g.fill(); g.stroke(); }); }
      break;
    }
    case 'crown': case 'beardcrown': {
      g.fillStyle = col('#ffc53d');
      g.beginPath(); g.moveTo(-hr * 0.7, -hr * 0.65); g.lineTo(-hr * 0.8, -hr * 1.35); g.lineTo(-hr * 0.35, -hr * 0.95); g.lineTo(0, -hr * 1.5); g.lineTo(hr * 0.35, -hr * 0.95); g.lineTo(hr * 0.8, -hr * 1.35); g.lineTo(hr * 0.7, -hr * 0.65); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#ff4f73'; g.beginPath(); g.arc(0, -hr * 0.85, hr * 0.12, 0, TAU); g.fill();
      break;
    }
    case 'nemes': { // striped pharaoh headdress
      g.fillStyle = col('#ffc53d');
      g.beginPath(); g.moveTo(-hr * 1.35, hr * 1.1); g.lineTo(-hr * 1.1, -hr * 0.6); g.quadraticCurveTo(0, -hr * 1.35, hr * 1.1, -hr * 0.6); g.lineTo(hr * 0.9, -hr * 0.2); g.lineTo(-hr * 0.2, -hr * 0.35); g.lineTo(-hr * 0.45, hr * 1.1); g.closePath(); g.fill(); g.stroke();
      g.save(); g.clip(); g.strokeStyle = col('#2f5bd8'); g.lineWidth = 4; for (let i = -3; i < 6; i++) { g.beginPath(); g.moveTo(-hr * 1.6, -hr * 1.0 + i * hr * 0.32); g.lineTo(hr * 1.4, -hr * 1.0 + i * hr * 0.32 - hr * 0.2); g.stroke(); } g.restore();
      g.fillStyle = col('#ffc53d'); g.beginPath(); g.arc(hr * 0.2, -hr * 0.95, hr * 0.14, 0, TAU); g.fill(); g.stroke();

    }
    case 'mummy': {
      g.strokeStyle = col('#cbbd9a'); g.lineWidth = 3;
      for (let i = -3; i < 4; i++) { g.beginPath(); g.moveTo(-hr, i * hr * 0.28); g.lineTo(hr, i * hr * 0.28 + hr * 0.12); g.stroke(); }
      break;
    }
    case 'furhood': { // yeti
      g.fillStyle = col(look.hair);
      for (let i = 0; i < 9; i++) { const a = Math.PI * 0.9 + i * 0.16; g.beginPath(); g.arc(Math.cos(a) * hr * 0.95, Math.sin(a) * hr * 0.95, hr * 0.32, 0, TAU); g.fill(); }
      if (look.goggles) {
        g.fillStyle = col('#2b2b3a'); g.fillRect(-hr * 0.9, -hr * 0.35, hr * 1.9, hr * 0.18);
        g.fillStyle = col('#ff8a2b'); g.beginPath(); g.ellipse(hr * 0.35, -hr * 0.3, hr * 0.55, hr * 0.28, 0, 0, TAU); g.fill(); g.strokeStyle = OUTLINE; g.lineWidth = 3; g.stroke();

      }
      break;
    }
    case 'glitch': {
      const t = look._t || 0;
      for (let i = 0; i < 7; i++) { g.fillStyle = i % 2 ? col('#ff3df2') : col('#3dfff6'); g.fillRect(-hr + ((i * 37 + Math.floor(t * 12) * 13) % (hr * 2)), -hr * 1.1 + (i * 7) % hr, hr * 0.35, hr * 0.25); }
      break;
    }
    case 'horns': {
      g.fillStyle = col('#f2ecdc');

      break;
    }

      break;
    }
    case 'cap': {
      g.fillStyle = col(look.capColor || '#3a6df0');

      g.beginPath(); g.ellipse(hr * 0.9, -hr * 0.12, hr * 0.7, hr * 0.16, 0, 0, TAU); g.fill(); g.stroke();
      break;
    }
  }
  if (look.beard) {
    g.fillStyle = col(look.beard);
    g.beginPath(); g.moveTo(-hr * 0.3, hr * 0.2); g.quadraticCurveTo(hr * 0.2, hr * 0.35, hr * 1.0, hr * 0.2);
    g.quadraticCurveTo(hr * 1.0, hr * 1.2, hr * 0.3, hr * 1.55); g.quadraticCurveTo(-hr * 0.4, hr * 1.2, -hr * 0.3, hr * 0.2); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = col(shade(look.beard, -0.2)); g.beginPath(); g.ellipse(hr * 0.55, hr * 0.42, hr * 0.35, hr * 0.12, 0.1, 0, TAU); g.fill();
  }
  if (look.shades) {
    g.fillStyle = '#12101c'; g.strokeStyle = OUTLINE; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-hr * 0.05, -hr * 0.12); g.lineTo(hr * 1.02, -hr * 0.12); g.lineTo(hr * 0.92, hr * 0.18); g.lineTo(hr * 0.55, hr * 0.2); g.lineTo(hr * 0.45, hr * 0.02); g.lineTo(hr * 0.35, hr * 0.2); g.lineTo(hr * 0.02, hr * 0.15); g.closePath(); g.fill();

  }
}

// ---------------- weapons ----------------
function drawWeapon(g, type, hx, hy, a, look, pose, col, back) {
  g.save();
  g.translate(hx, hy);
  // weapon direction follows the forearm angle
  g.rotate(-a + Math.PI / 2);
  g.strokeStyle = OUTLINE; g.lineWidth = 3;
  const glow = look.wpnGlow;
  const tier = look.wpnTier || 1;
  const c1 = col(look.wpnColor || '#c9c3de');
  switch (type) {
    case 'staff': {
      g.fillStyle = col('#8a5a2b');
      roundRect(g, -34, -3, 64, 6, 3); g.fill(); g.stroke();
      g.fillStyle = c1; g.beginPath(); g.moveTo(30, 0); g.lineTo(38, -8); g.lineTo(48, 0); g.lineTo(38, 8); g.closePath(); g.fill(); g.stroke();
      if (tier >= 2) { g.beginPath(); g.moveTo(34, -4); g.lineTo(30, -12); g.moveTo(34, 4); g.lineTo(30, 12); g.stroke(); }
      if (glow) { g.globalCompositeOperation = 'lighter'; drawGlowLocal(g, 39, 0, 14 + tier * 3, glow); g.globalCompositeOperation = 'source-over'; }
      break;
    }
    case 'hammer': {
      // handle, then a chunky head across the end of the shaft
      g.fillStyle = col('#7a5230'); roundRect(g, -12, -4, 50, 8, 3); g.fill(); g.stroke();
      const hw = 22 + tier * 3, hh = 38 + tier * 6;
      g.fillStyle = c1; roundRect(g, 34, -hh / 2, hw, hh, 6); g.fill(); g.stroke();
      g.fillStyle = col(shade(look.wpnColor || '#c9c3de', -0.3)); roundRect(g, 34, -hh / 2, hw * 0.35, hh, 4); g.fill();
      g.fillStyle = col(shade(look.wpnColor || '#c9c3de', 0.35)); g.fillRect(34 + hw * 0.55, -hh / 2 + 5, 4, hh - 10);
      g.strokeStyle = OUTLINE; g.lineWidth = 3; g.beginPath(); g.moveTo(34, -hh / 2 + 8); g.lineTo(34 + hw, -hh / 2 + 8); g.moveTo(34, hh / 2 - 8); g.lineTo(34 + hw, hh / 2 - 8); g.stroke();
      if (glow) { g.globalCompositeOperation = 'lighter'; drawGlowLocal(g, 34 + hw / 2, 0, 22 + tier * 3, glow); g.globalCompositeOperation = 'source-over'; }
      break;
    }
    case 'dagger': {
      g.fillStyle = col('#3a2a20'); roundRect(g, -4, -2.5, 10, 5, 2); g.fill(); g.stroke();
      g.fillStyle = c1; g.beginPath(); g.moveTo(6, -4); g.lineTo(26 + tier * 2, 0); g.lineTo(6, 4); g.closePath(); g.fill(); g.stroke();
      if (glow) { g.globalCompositeOperation = 'lighter'; drawGlowLocal(g, 16, 0, 10 + tier * 2, glow); g.globalCompositeOperation = 'source-over'; }
      break;
    }
    case 'daggers': {
      g.fillStyle = col('#3a2a20'); roundRect(g, -4, -2.5, 10, 5, 2); g.fill(); g.stroke();
      g.fillStyle = c1; g.beginPath(); g.moveTo(6, -4); g.lineTo(26 + tier * 2, 0); g.lineTo(6, 4); g.closePath(); g.fill(); g.stroke();
      if (glow) { g.globalCompositeOperation = 'lighter'; drawGlowLocal(g, 16, 0, 10 + tier * 2, glow); g.globalCompositeOperation = 'source-over'; }
      break;
    }
    case 'keytar': {
      g.fillStyle = col('#2b2b3a'); roundRect(g, -6, -3, 36, 6, 2); g.fill(); g.stroke();
      g.fillStyle = c1; g.beginPath(); g.moveTo(28, -5); g.lineTo(52, -16); g.lineTo(58, -2); g.lineTo(52, 14); g.lineTo(34, 10); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#fff'; for (let i = 0; i < 5; i++) g.fillRect(-2 + i * 6, -2, 3, 4);
      if (glow) { g.globalCompositeOperation = 'lighter'; drawGlowLocal(g, 48, 0, 16 + tier * 3, glow); g.globalCompositeOperation = 'source-over'; }
      break;
    }
    case 'glitchsword': {
      const t = look._t || 0;
      for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#ff3df2' : '#3dfff6'; g.fillRect(4 + i * 5, -3 + ((i * 7 + Math.floor(t * 15)) % 5) - 2, 6, 6); }
      g.fillStyle = '#fff'; g.fillRect(-4, -2, 8, 4);
      break;
    }
    case 'bow': {
      g.strokeStyle = col('#8a5a2b'); g.lineWidth = 4; g.beginPath(); g.arc(-6, 0, 22, -1.2, 1.2); g.stroke();
      g.strokeStyle = '#fff'; g.lineWidth = 1; g.beginPath(); g.moveTo(-6 + Math.cos(-1.2) * 22, Math.sin(-1.2) * 22); g.lineTo(-6 + Math.cos(1.2) * 22, Math.sin(1.2) * 22); g.stroke();
      break;
    }
    case 'club': {
      g.fillStyle = col('#8a5a2b'); g.beginPath(); g.moveTo(-4, -3); g.lineTo(34, -8); g.quadraticCurveTo(42, 0, 34, 8); g.lineTo(-4, 3); g.closePath(); g.fill(); g.stroke();
      break;
    }
    case 'sword': {
      g.fillStyle = col('#3a2a20'); g.fillRect(-4, -2.5, 10, 5); g.strokeRect(-4, -2.5, 10, 5);
      g.fillStyle = col('#ffc53d'); g.fillRect(5, -8, 4, 16); g.strokeRect(5, -8, 4, 16);
      g.fillStyle = c1; g.beginPath(); g.moveTo(9, -4); g.lineTo(46, -3); g.lineTo(52, 0); g.lineTo(46, 3); g.lineTo(9, 4); g.closePath(); g.fill(); g.stroke();
      break;
    }
    case 'spear': {
      g.fillStyle = col('#8a5a2b'); roundRect(g, -20, -2.5, 64, 5, 2); g.fill(); g.stroke();
      g.fillStyle = c1; g.beginPath(); g.moveTo(42, -6); g.lineTo(58, 0); g.lineTo(42, 6); g.closePath(); g.fill(); g.stroke();
      break;
    }
    case 'wand': {
      g.fillStyle = col('#5a3a2a'); roundRect(g, -4, -2, 26, 4, 2); g.fill(); g.stroke();
      g.fillStyle = c1; g.beginPath(); g.arc(24, 0, 5, 0, TAU); g.fill(); g.stroke();
      if (glow) { g.globalCompositeOperation = 'lighter'; drawGlowLocal(g, 24, 0, 14, glow); g.globalCompositeOperation = 'source-over'; }
      break;
    }
    case 'bomb': {

  bug(g, f, look, fx, col) { // The Millennium Bug: a giant glitch beetle with a CRT head
    const T = f.clock || 0;
    const atk = f.anim === 'attack' ? Math.sin(Math.min(1, f.animT / 0.7) * Math.PI) : 0;
    g.strokeStyle = OUTLINE; g.lineWidth = 4;
    // legs
    for (let i = 0; i < 3; i++) for (const sd of [-1, 1]) {
      const ph = Math.sin(T * 6 + i * 2 + (sd > 0 ? 1 : 0)) * 8;
      g.strokeStyle = OUTLINE; g.lineWidth = 9; g.beginPath(); g.moveTo(-40 + i * 40, -60); g.lineTo(-60 + i * 40 + sd * 10, -90 + ph); g.lineTo(-70 + i * 44 + sd * 16, 0); g.stroke();
      g.strokeStyle = col('#2b2b3a'); g.lineWidth = 5; g.beginPath(); g.moveTo(-40 + i * 40, -60); g.lineTo(-60 + i * 40 + sd * 10, -90 + ph); g.lineTo(-70 + i * 44 + sd * 16, 0); g.stroke();
    }
    // shell
    g.lineWidth = 4; g.strokeStyle = OUTLINE;
    g.fillStyle = col('#3a2a7a'); g.beginPath(); g.ellipse(-10, -90, 100, 58, 0, Math.PI, TAU); g.lineTo(90, -80); g.lineTo(-110, -80); g.closePath(); g.fill(); g.stroke();
    g.save(); g.clip();
    for (let i = 0; i < 40; i++) { g.fillStyle = (i + Math.floor(T * 8)) % 3 ? '#ff3df2' : '#3dfff6'; g.globalAlpha = 0.5; g.fillRect(-110 + ((i * 53) % 200), -148 + ((i * 29) % 70), 10, 10); }
    g.globalAlpha = 1; g.restore();
    g.fillStyle = col('#1b1030'); g.fillRect(-12, -148, 4, 68);
    // CRT head
    g.save(); g.translate(96 + atk * 40, -110 + Math.sin(T * 3) * 4);
    g.fillStyle = col('#d9d4c4'); roundRect(g, -40, -40, 80, 70, 8); g.fill(); g.stroke();
    g.fillStyle = '#0a0717'; roundRect(g, -32, -32, 60, 46, 10); g.fill();
    g.fillStyle = '#3dff7a'; g.font = `bold 14px ${FONT_PIXEL}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const glitchText = ['19100', '00:00', 'Y2K', '1/1/00', 'ERR'][Math.floor(T * 1.5) % 5];
    g.fillText(glitchText, -2, -9);
    g.fillStyle = 'rgba(61,255,122,.15)'; for (let i = 0; i < 8; i++) g.fillRect(-32, -32 + i * 6, 60, 2);
    // antennae
    g.strokeStyle = OUTLINE; g.lineWidth = 3; g.beginPath(); g.moveTo(-10, -40); g.lineTo(-30, -80 + Math.sin(T * 5) * 6); g.moveTo(10, -40); g.lineTo(30, -84 + Math.cos(T * 5) * 6); g.stroke();
    g.fillStyle = '#ff4f73'; g.beginPath(); g.arc(-30, -80 + Math.sin(T * 5) * 6, 5, 0, TAU); g.arc(30, -84 + Math.cos(T * 5) * 6, 5, 0, TAU); g.fill();
    // mandibles
    g.fillStyle = col('#2b2b3a'); g.strokeStyle = OUTLINE; g.lineWidth = 3;
    g.beginPath(); g.moveTo(30, 20); g.quadraticCurveTo(60, 20 + atk * 10, 50, 40); g.lineTo(34, 30); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-30, 20); g.quadraticCurveTo(-10, 44 + atk * 10, 10, 40); g.lineTo(-6, 28); g.closePath(); g.fill(); g.stroke();
    g.restore();
  },
};

// ---- 06_bg.js ----
// ============================================================
//  Backgrounds: parallax layers (pre-rendered seamless tiles),
//  ground, detail props with easter eggs, weather, lighting.
// ============================================================
function periodic(W, seed, terms = 5, amp = 1) {
  const r = makeRng(seed);
  const t = [];
  for (let i = 0; i < terms; i++) t.push({ k: r.int(1 + i, 2 + i * 3), a: amp / (1 + i * 0.9) * r.range(0.6, 1), p: r.range(0, TAU) });
  return (x) => { let v = 0; for (const q of t) v += q.a * Math.sin((x / W) * TAU * q.k + q.p); return v; };
}
function makeTile(W, H, drawFn) {
  const c = document.createElement('canvas');
  const s = View.scale;
  c.width = Math.ceil(W * s); c.height = Math.ceil(H * s);
  const g = c.getContext('2d');
  g.scale(s, s);
  g.lineJoin = 'round'; g.lineCap = 'round';
  drawFn(g, W, H);
  return { c, W, H };
}
// draw an object at x and its wrapped copies so tiles are seamless
function wrap(W, x, pad, fn) { fn(x); if (x < pad) fn(x + W); if (x > W - pad) fn(x - W); }
function silhouette(g, W, base, f, color, bottom = 400) {
  g.fillStyle = color; g.beginPath(); g.moveTo(0, bottom);
  for (let x = 0; x <= W; x += 6) g.lineTo(x, base + f(x));
  g.lineTo(W, bottom); g.closePath(); g.fill();
}
function vgrad(g, y0, y1, stops) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  return gr;
}

// ---------- reusable scenery painters ----------
const Paint = {
  roundTree(g, x, y, s, c1, c2, trunk = '#6b4424') {
    g.fillStyle = trunk; g.fillRect(x - 4 * s, y - 30 * s, 8 * s, 30 * s);
    g.fillStyle = c1;
    g.beginPath(); g.arc(x, y - 44 * s, 22 * s, 0, TAU); g.arc(x - 16 * s, y - 34 * s, 15 * s, 0, TAU); g.arc(x + 16 * s, y - 34 * s, 15 * s, 0, TAU); g.fill();
    g.fillStyle = c2; g.beginPath(); g.arc(x - 6 * s, y - 50 * s, 12 * s, 0, TAU); g.arc(x - 18 * s, y - 38 * s, 7 * s, 0, TAU); g.fill();
  },
  pine(g, x, y, s, c1, c2, snow) {
    g.fillStyle = '#5a3a24'; g.fillRect(x - 3 * s, y - 14 * s, 6 * s, 14 * s);
    for (let i = 0; i < 3; i++) {
      const yy = y - 12 * s - i * 18 * s, w = (26 - i * 6) * s;
      g.fillStyle = c1; g.beginPath(); g.moveTo(x - w, yy); g.lineTo(x, yy - 30 * s); g.lineTo(x + w, yy); g.closePath(); g.fill();
      g.fillStyle = c2; g.beginPath(); g.moveTo(x - w, yy); g.lineTo(x, yy - 30 * s); g.lineTo(x - w * 0.2, yy); g.closePath(); g.fill();
      if (snow) { g.fillStyle = snow; g.beginPath(); g.moveTo(x - w * 0.55, yy - 13 * s); g.lineTo(x, yy - 30 * s); g.lineTo(x + w * 0.55, yy - 13 * s); g.quadraticCurveTo(x, yy - 18 * s, x - w * 0.55, yy - 13 * s); g.fill(); }
    }
  },
  palm(g, x, y, s) {
    g.strokeStyle = '#8a5a2b'; g.lineWidth = 6 * s; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 10 * s, y - 40 * s, x + 4 * s, y - 80 * s); g.stroke();
    g.fillStyle = '#3f9a4a';
    for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + (i - 2.5) * 0.55; g.beginPath(); g.ellipse(x + 4 * s + Math.cos(a) * 20 * s, y - 80 * s + Math.sin(a) * 10 * s + 8 * s, 24 * s, 6 * s, a, 0, TAU); g.fill(); }
  },
  cloud(g, x, y, s, c = '#ffffff') {
    g.fillStyle = c; g.beginPath();
    g.arc(x, y, 18 * s, 0, TAU); g.arc(x + 20 * s, y - 8 * s, 22 * s, 0, TAU); g.arc(x + 44 * s, y, 17 * s, 0, TAU); g.arc(x + 22 * s, y + 6 * s, 16 * s, 0, TAU); g.fill();
  },
  house(g, x, y, w, h, wall, roof, o = {}) {
    g.fillStyle = wall; g.fillRect(x, y - h, w, h);
    g.fillStyle = shade(wall, -0.2); g.fillRect(x, y - h, w * 0.25, h);
    if (o.timber) { g.strokeStyle = '#5a3a24'; g.lineWidth = 3; g.strokeRect(x, y - h, w, h); g.beginPath(); g.moveTo(x, y - h * 0.5); g.lineTo(x + w, y - h * 0.5); g.moveTo(x + w * 0.5, y - h); g.lineTo(x + w * 0.5, y); g.stroke(); }
    g.fillStyle = roof; g.beginPath(); g.moveTo(x - 8, y - h); g.lineTo(x + w / 2, y - h - h * 0.7); g.lineTo(x + w + 8, y - h); g.closePath(); g.fill();
    g.fillStyle = shade(roof, -0.25); g.beginPath(); g.moveTo(x - 8, y - h); g.lineTo(x + w / 2, y - h - h * 0.7); g.lineTo(x + w * 0.3, y - h); g.closePath(); g.fill();
    // windows
    g.fillStyle = o.lit ? '#ffe9a0' : '#3a4a7a';
    g.fillRect(x + w * 0.15, y - h * 0.8, w * 0.22, h * 0.25); g.fillRect(x + w * 0.63, y - h * 0.8, w * 0.22, h * 0.25);
    g.fillStyle = '#5a3a24'; g.fillRect(x + w * 0.4, y - h * 0.42, w * 0.2, h * 0.42);
    if (o.chimney) { g.fillStyle = '#8a4a3a'; g.fillRect(x + w * 0.72, y - h - h * 0.55, w * 0.12, h * 0.35); }
  },
  mountain(g, x, y, w, h, c, snow, shadowC) {
    g.fillStyle = c; g.beginPath(); g.moveTo(x - w / 2, y); g.lineTo(x, y - h); g.lineTo(x + w / 2, y); g.closePath(); g.fill();
    if (shadowC) { g.fillStyle = shadowC; g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + w / 2, y); g.lineTo(x + w * 0.1, y); g.closePath(); g.fill(); }
    if (snow) { g.fillStyle = snow; g.beginPath(); g.moveTo(x - w * 0.14, y - h * 0.72); g.lineTo(x, y - h); g.lineTo(x + w * 0.14, y - h * 0.72); g.lineTo(x + w * 0.05, y - h * 0.66); g.lineTo(x - w * 0.03, y - h * 0.74); g.closePath(); g.fill(); }
  },
  castle(g, x, y, s, c, roof) {
    g.fillStyle = c;
    g.fillRect(x - 40 * s, y - 60 * s, 80 * s, 60 * s);
    for (const tx of [-50, 34]) { g.fillRect(x + tx * s, y - 90 * s, 16 * s, 90 * s); g.fillStyle = roof; g.beginPath(); g.moveTo(x + (tx - 4) * s, y - 90 * s); g.lineTo(x + (tx + 8) * s, y - 116 * s); g.lineTo(x + (tx + 20) * s, y - 90 * s); g.fill(); g.fillStyle = c; }
    g.fillRect(x - 10 * s, y - 100 * s, 20 * s, 40 * s);
    g.fillStyle = roof; g.beginPath(); g.moveTo(x - 14 * s, y - 100 * s); g.lineTo(x, y - 130 * s); g.lineTo(x + 14 * s, y - 100 * s); g.fill();
    for (let i = 0; i < 5; i++) { g.fillStyle = c; g.fillRect(x - 40 * s + i * 17 * s, y - 68 * s, 9 * s, 8 * s); }
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x - 8 * s, y - 24 * s, 16 * s, 24 * s);
    g.strokeStyle = '#ff4f73'; g.lineWidth = 1.5 * s; g.beginPath(); g.moveTo(x, y - 130 * s); g.lineTo(x, y - 145 * s); g.stroke();
    g.fillStyle = '#ff4f73'; g.fillRect(x, y - 145 * s, 10 * s, 6 * s);
  },
  pyramid(g, x, y, w, c) {
    g.fillStyle = c; g.beginPath(); g.moveTo(x - w / 2, y); g.lineTo(x, y - w * 0.6); g.lineTo(x + w / 2, y); g.closePath(); g.fill();
    g.fillStyle = shade(c, -0.22); g.beginPath(); g.moveTo(x, y - w * 0.6); g.lineTo(x + w / 2, y); g.lineTo(x + w * 0.08, y); g.closePath(); g.fill();
    g.strokeStyle = shade(c, -0.12); g.lineWidth = 1;
    for (let i = 1; i < 8; i++) { const yy = y - (w * 0.6) * i / 8, hw = (w / 2) * (1 - i / 8); g.beginPath(); g.moveTo(x - hw, yy); g.lineTo(x + hw, yy); g.stroke(); }
  },
  cactus(g, x, y, s, shades) {
    g.fillStyle = '#4aa84a'; roundRect(g, x - 6 * s, y - 50 * s, 12 * s, 50 * s, 6 * s); g.fill();
    roundRect(g, x - 20 * s, y - 36 * s, 8 * s, 20 * s, 4 * s); g.fill(); g.fillRect(x - 16 * s, y - 20 * s, 12 * s, 6 * s);
    roundRect(g, x + 12 * s, y - 42 * s, 8 * s, 18 * s, 4 * s); g.fill(); g.fillRect(x + 4 * s, y - 28 * s, 12 * s, 6 * s);
    if (shades) { g.fillStyle = '#1b1030'; g.fillRect(x - 8 * s, y - 42 * s, 16 * s, 4 * s); g.fillRect(x - 7 * s, y - 42 * s, 6 * s, 5 * s); g.fillRect(x + 1 * s, y - 42 * s, 6 * s, 5 * s); }
  },
  bigShroom(g, x, y, s, cap, stem, glow) {
    g.fillStyle = stem; roundRect(g, x - 8 * s, y - 60 * s, 16 * s, 60 * s, 6 * s); g.fill();
    g.fillStyle = cap; g.beginPath(); g.ellipse(x, y - 60 * s, 40 * s, 22 * s, 0, Math.PI, TAU); g.fill();
    g.fillStyle = glow; for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(x - 26 * s + i * 13 * s, y - 68 * s - (i % 2) * 6 * s, 3.5 * s, 0, TAU); g.fill(); }
  },
  building(g, x, y, w, h, c, win, r) {
    g.fillStyle = c; g.fillRect(x, y - h, w, h);
    g.fillStyle = shade(c, 0.08); g.fillRect(x + w - 6, y - h, 6, h);
    for (let yy = y - h + 10; yy < y - 12; yy += 16) for (let xx = x + 6; xx < x + w - 10; xx += 12) {
      g.fillStyle = r() < 0.4 ? win[Math.floor(r() * win.length)] : shade(c, -0.25);
      g.fillRect(xx, yy, 6, 8);
    }
    if (r() < 0.5) { g.strokeStyle = shade(c, 0.2); g.lineWidth = 2; g.beginPath(); g.moveTo(x + w / 2, y - h); g.lineTo(x + w / 2, y - h - 20); g.stroke(); g.fillStyle = '#ff4f73'; g.beginPath(); g.arc(x + w / 2, y - h - 20, 2.5, 0, TAU); g.fill(); }
  },
};

// ---------- biome definitions ----------
// Each: sky(stops), far/mid/near painters, ground painter, props list, weather, tint
const BIOMES = {};
function groundBase(g, W, H, top, stops) {
  g.fillStyle = vgrad(g, 0, H, stops); g.fillRect(0, 0, W, H);
}
BIOMES.meadow = {
  music: 'meadow', sky: ['#5fb2ff', '#a9dbff', '#ffe7c2'], sun: { x: 0.75, y: 90, r: 38, c: '#fff4c2' }, clouds: '#ffffff',
  far(g, W, H) {
    const f = periodic(W, 11, 4, 40);
    silhouette(g, W, 250, f, '#9cc2e8');
    const f2 = periodic(W, 12, 5, 24);
    silhouette(g, W, 285, f2, '#7fb0d8');
    const r = makeRng(5);
    for (let i = 0; i < 4; i++) { const x = r.range(0, W); wrap(W, x, 80, (xx) => Paint.mountain(g, xx, 290, 260, r.range(110, 170), '#8fb2d6', '#f4fbff', '#7a9dc4')); }
  },
  mid(g, W, H) {
    const f = periodic(W, 21, 4, 18);
    silhouette(g, W, 300, f, '#6fbf5a');
    const r = makeRng(22);
    for (let i = 0; i < 26; i++) { const x = r.range(0, W); const s = r.range(0.5, 0.8); wrap(W, x, 40, (xx) => Paint.roundTree(g, xx, 305 + f(xx) * 0.4, s, '#4f9f45', '#77c26a')); }
    // windmill
    wrap(W, W * 0.62, 60, (xx) => {
      g.fillStyle = '#e9dcc2'; g.beginPath(); g.moveTo(xx - 14, 300); g.lineTo(xx - 8, 236); g.lineTo(xx + 8, 236); g.lineTo(xx + 14, 300); g.fill();
      g.fillStyle = '#b0502a'; g.beginPath(); g.moveTo(xx - 11, 238); g.lineTo(xx, 222); g.lineTo(xx + 11, 238); g.fill();
    });
    // tiny cows in a field (the cow level is foreshadowed)
    for (let i = 0; i < 3; i++) { const x = W * 0.2 + i * 22; g.fillStyle = '#fff'; g.fillRect(x, 292, 10, 5); g.fillStyle = '#1b1030'; g.fillRect(x + 3, 292, 3, 2); g.fillRect(x + 9, 290, 3, 3); }
  },
  near(g, W, H) {
    const r = makeRng(33);
    for (let i = 0; i < 7; i++) {
      const x = i * (W / 7) + r.range(0, 60);
      wrap(W, x, 100, (xx) => {
        if (i % 3 === 1) Paint.house(g, xx, 322, 70, 52, '#f1dfb3', '#d8343f', { timber: true, chimney: true });
        else Paint.roundTree(g, xx, 324, r.range(1.1, 1.4), '#3f8f3a', '#63b35a');
      });
    }
    // fence line
    g.fillStyle = '#a0703a';
    for (let x = 0; x < W; x += 22) { g.fillRect(x, 300, 5, 26); }
    g.fillRect(0, 306, W, 4); g.fillRect(0, 316, W, 4);
  },
  ground(g, W, H) {
    groundBase(g, W, H, 0, ['#5aa83f', '#79c24f', '#6db548']);
    // dirt path band through the middle
    g.fillStyle = '#d9b77a'; g.beginPath(); g.moveTo(0, 70);
    for (let x = 0; x <= W; x += 16) g.lineTo(x, 70 + Math.sin(x / W * TAU * 3) * 8);
    for (let x = W; x >= 0; x -= 16) g.lineTo(x, 150 + Math.sin(x / W * TAU * 2 + 1) * 10);
    g.fill();
    const r = makeRng(44);

    case 'ankh': g.ellipse(x, y - 6, 5, 6, 0, 0, TAU); g.moveTo(x, y); g.lineTo(x, y + 12); g.moveTo(x - 8, y + 2); g.lineTo(x + 8, y + 2); break;
    case 'cart': g.rect(x - 8, y - 10, 16, 20); g.rect(x - 5, y - 7, 10, 8); break;
    case 'wave': for (let i = 0; i < 3; i++) { g.moveTo(x - 10, y - 6 + i * 6); g.lineTo(x - 5, y - 9 + i * 6); g.lineTo(x, y - 6 + i * 6); g.lineTo(x + 5, y - 9 + i * 6); g.lineTo(x + 10, y - 6 + i * 6); } break;

}

// ---------- the background controller ----------
function createBackground(biomeId, levelSeed, night) {
  const B = BIOMES[biomeId] || BIOMES.meadow;
  const bg = { B, id: biomeId, t: 0, seed: levelSeed, night: !!night, props: [], clouds: [], stars: [] };
  bg.build = () => {
    bg.far = makeTile(1400, 340, (g, W, H) => B.far(g, W, H));
    bg.mid = makeTile(1600, 340, (g, W, H) => B.mid(g, W, H));
    bg.near = makeTile(1800, 340, (g, W, H) => B.near(g, W, H));
    bg.ground = makeTile(1024, VIEW_H - GROUND_TOP + 30, (g, W, H) => B.ground(g, W, H));
  };
  bg.build();
  const r = makeRng(levelSeed);
  for (let i = 0; i < 7; i++) bg.clouds.push({ x: r.range(0, 2400), y: r.range(30, 170), s: r.range(0.6, 1.4), v: r.range(4, 12) });
  for (let i = 0; i < 90; i++) bg.stars.push({ x: r.range(0, 1), y: r.range(0, 260), s: r.range(0.5, 2), p: r.range(0, TAU) });
  bg.placeProps = (stageLen) => {
    bg.props = [];
    const kinds = B.props;
    let x = 200;
    let i = 0;
    while (x < stageLen - 100) {
      bg.props.push({ kind: kinds[i % kinds.length], x, y: GROUND_TOP - 4 });
      x += r.range(260, 520); i++;
    }
  };
  bg.drawSky = (camX, T) => {
    const g = ctx;
    const sky = B.sky;
    const gr = g.createLinearGradient(0, 0, 0, GROUND_TOP);
    gr.addColorStop(0, sky[0]); gr.addColorStop(0.6, sky[1]); gr.addColorStop(1, sky[2]);
    g.fillStyle = gr; g.fillRect(0, 0, VIEW_W, GROUND_TOP + 10);
    if (B.stars || bg.night) {
      for (const s of bg.stars) { const a = 0.4 + 0.6 * Math.abs(Math.sin(T * 1.5 + s.p)); g.fillStyle = `rgba(255,255,255,${a})`; g.fillRect(((s.x * VIEW_W * 2 - camX * 0.02) % VIEW_W + VIEW_W) % VIEW_W, s.y, s.s, s.s); }
    }
    if (B.sun) {
      const sx = B.sun.x * VIEW_W - camX * 0.01;
      g.globalCompositeOperation = 'lighter'; drawGlow(sx, B.sun.y, B.sun.r * 4, '#ffe9a0', 0.5); g.globalCompositeOperation = 'source-over';
      g.fillStyle = B.sun.c; g.beginPath(); g.arc(sx, B.sun.y, B.sun.r, 0, TAU); g.fill();
    }
    if (B.moon) {
      const mx = B.moon.x * VIEW_W - camX * 0.01;
      g.globalCompositeOperation = 'lighter'; drawGlow(mx, B.moon.y, B.moon.r * 3.5, '#b8c8ff', 0.5); g.globalCompositeOperation = 'source-over';
      g.fillStyle = '#f4f0ff'; g.beginPath(); g.arc(mx, B.moon.y, B.moon.r, 0, TAU); g.fill();
      g.fillStyle = 'rgba(180,170,220,.6)'; g.beginPath(); g.arc(mx - 6, B.moon.y - 4, 5, 0, TAU); g.arc(mx + 7, B.moon.y + 6, 3.5, 0, TAU); g.fill();
    }
    if (biomeId === 'ice' && bg.night || biomeId === 'ice' && B === BIOMES.ice && bg.aurora) {
      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        g.fillStyle = ['rgba(62,230,168,.18)', 'rgba(85,200,255,.14)', 'rgba(183,124,255,.12)'][i];
        g.beginPath(); g.moveTo(0, 80 + i * 20);
        for (let x = 0; x <= VIEW_W; x += 20) g.lineTo(x, 80 + i * 20 + Math.sin(x / 120 + T * 0.6 + i) * 22);
        for (let x = VIEW_W; x >= 0; x -= 20) g.lineTo(x, 140 + i * 20 + Math.sin(x / 90 + T * 0.5 + i) * 18);
        g.fill();
      }
      g.globalCompositeOperation = 'source-over';
    }
    if (B.clouds) {
      for (const c of bg.clouds) {
        const x = ((c.x + T * c.v - camX * 0.05) % 2400 + 2400) % 2400 - 200;
        if (x < -150 || x > VIEW_W + 50) continue;
        g.globalAlpha = 0.9; Paint.cloud(g, x, c.y, c.s, B.clouds); g.globalAlpha = 1;
      }
    }
    if (B.volcano) {
      // eruption glow
      const vx = ((VIEW_W * 0.5 - camX * 0.1) % 1400 + 1400) % 1400;
      g.globalCompositeOperation = 'lighter'; drawGlow(vx, 110, 120 + Math.sin(T * 3) * 20, '#ff5a1f', 0.6); g.globalCompositeOperation = 'source-over';
      if (Math.random() < 0.3) Particles.add({ x: camX + vx + R(-20, 20), y: 110, vx: R(-80, 80), vy: R(-260, -120), g: 260, life: R(1, 2), size: R(2, 5), color: pick(['#ffd35c', '#ff7a2f']), glow: true });
    }
  };
  const drawTile = (tile, factor, camX, y = 0) => {
    const W = tile.W;
    let ox = -((camX * factor) % W);
    if (ox > 0) ox -= W;
    for (let x = ox; x < VIEW_W; x += W) ctx.drawImage(tile.c, x, y, W, tile.H);
  };
  bg.drawBack = (camX, T) => {
    bg.drawSky(camX, T);
    drawTile(bg.far, 0.12, camX, 0);
    drawTile(bg.mid, 0.3, camX, 0);
    if (B.rays) {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 5; i++) {
        const x = ((i * 300 - camX * 0.4) % 1500 + 1500) % 1500 - 200;
        ctx.fillStyle = `rgba(255,247,194,${0.05 + 0.03 * Math.sin(T + i)})`;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 60, 0); ctx.lineTo(x + 220, GROUND_TOP); ctx.lineTo(x + 120, GROUND_TOP); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    drawTile(bg.near, 0.6, camX, -12);
    drawTile(bg.ground, 1, camX, GROUND_TOP - 20);
    // depth shading on the floor: darker at the back
    const gr = ctx.createLinearGradient(0, GROUND_TOP - 20, 0, GROUND_TOP + 30);
    gr.addColorStop(0, 'rgba(0,0,0,.28)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, GROUND_TOP - 20, VIEW_W, 50);
    if (B.torches) {
      for (let i = 0; i < 6; i++) {
        const x = ((i * 300 + 150 - camX * 0.6) % 1800 + 1800) % 1800 - 100;
        const fl = Math.sin(T * 13 + i) * 3;
        ctx.globalCompositeOperation = 'lighter'; drawGlow(x, 150, 70 + fl * 3, '#ff9a3a', 0.55); ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#ffd35c'; ctx.beginPath(); ctx.moveTo(x - 6, 158); ctx.quadraticCurveTo(x - 5, 140 - fl, x, 132 - fl); ctx.quadraticCurveTo(x + 5, 140 - fl, x + 6, 158); ctx.fill();
        ctx.fillStyle = '#5a3a24'; ctx.fillRect(x - 5, 158, 10, 18);
      }
    }
    // props at the back edge of the floor
    for (const p of bg.props) {
      const sx = p.x - camX;
      if (sx < -150 || sx > VIEW_W + 150) continue;
      drawProp(ctx, p.kind, sx, p.y, T);
    }
  };
  bg.drawFront = (camX, T) => {
    // foreground silhouettes (grass tufts / rocks) with parallax > 1
    const f = 1.25;
    const base = VIEW_H + 4;
    ctx.fillStyle = B === BIOMES.ice ? 'rgba(230,243,255,.9)' : B === BIOMES.volcano ? 'rgba(20,6,6,.9)' : B === BIOMES.neon || B === BIOMES.glitch ? 'rgba(10,8,24,.9)' : B === BIOMES.desert ? 'rgba(200,150,90,.9)' : B === BIOMES.tomb ? 'rgba(60,40,20,.9)' : 'rgba(30,60,30,.85)';
    for (let i = -1; i < 7; i++) {
      const x = ((i * 260 - camX * f) % 1560 + 1560) % 1560 - 200;
      ctx.beginPath(); ctx.moveTo(x - 60, base);
      for (let k = 0; k < 8; k++) ctx.lineTo(x - 50 + k * 14, base - 18 - ((k * 37 + i * 11) % 16) - Math.sin(T * 2 + k + i) * 2);
      ctx.lineTo(x + 70, base); ctx.fill();
    }
    // one combined full-screen grade instead of two separate fills
    if (B.tint || bg.night) { ctx.fillStyle = bg.night && B.tint ? 'rgba(20,6,50,.3)' : bg.night ? 'rgba(10,10,40,.22)' : B.tint; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
    if (B.heat) {
      ctx.globalAlpha = 0.06; ctx.fillStyle = '#fff';
      for (let y = 180; y < 330; y += 8) ctx.fillRect(Math.sin(T * 3 + y) * 6, y, VIEW_W, 2);
      ctx.globalAlpha = 1;
    }
  };
  bg.weather = (camX, dt) => {
    const w = B.weather;
    const rate = { petals: 3, leaves: 5, fireflies: 3, sand: 18, snow: 30, embers: 14, rain: 60, pixels: 10, dust: 4 }[w] || 0;
    let n = rate * dt;
    while (n > 0) {
      if (Math.random() > n) break;
      n -= 1;
      const x = camX + R(-50, VIEW_W + 100);
      if (w === 'petals') Particles.add({ x, y: -10, vx: R(-40, -10), vy: R(20, 40), life: 8, size: 3, color: pick(['#ff9fb8', '#fff', '#ffe45c']), type: 'leaf', vr: R(-3, 3), drag: 1, shrink: false });
      else if (w === 'leaves') Particles.add({ x, y: R(-10, 60), vx: R(-50, -10), vy: R(20, 50), life: 7, size: 4, color: pick(['#d8a04a', '#8a5a2b', '#c9401a', '#6fae4a']), type: 'leaf', vr: R(-4, 4), drag: 1, shrink: false });
      else if (w === 'fireflies') Particles.add({ x, y: R(150, 480), vx: R(-15, 15), vy: R(-15, 15), life: R(2, 4), size: 3, color: pick(['#fff4a0', '#9dff5a', '#b8a0ff']), glow: true, drag: 1 });
      else if (w === 'sand') Particles.add({ x: camX + VIEW_W + 20, y: R(150, 520), vx: R(-420, -260), vy: R(-10, 20), life: 3, size: 1.5, color: '#fff1c2', type: 'line', drag: 1 });
      else if (w === 'snow') Particles.add({ x, y: -10, vx: R(-30, 10), vy: R(40, 90), life: 9, size: R(1.5, 3.5), color: '#ffffff', drag: 1, shrink: false });
      else if (w === 'embers') Particles.add({ x, y: VIEW_H + 10, vx: R(-20, 20), vy: R(-120, -50), life: R(3, 5), size: R(1.5, 3), color: pick(['#ffd35c', '#ff7a2f']), glow: true, drag: 1 });
      else if (w === 'rain') Particles.add({ x: x + 100, y: -10, vx: -120, vy: 900, life: 0.7, size: 2, color: 'rgba(160,200,255,.6)', type: 'line', drag: 1 });
      else if (w === 'pixels') Particles.add({ x, y: R(0, VIEW_H), vx: 0, vy: R(-30, 30), life: R(0.3, 1.2), size: R(3, 8), color: pick(['#ff3df2', '#3dfff6', '#ffffff']), type: 'pix', drag: 1, shrink: false });
      else if (w === 'dust') Particles.add({ x, y: R(100, 500), vx: R(-10, 10), vy: R(-5, 5), life: R(3, 6), size: R(1, 2), color: 'rgba(255,220,160,.5)', drag: 1 });
    }
  };
  return bg;
}
